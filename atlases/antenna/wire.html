});

/* ---- 1.9 Yagi-Uda ---------------------------------------------------- */
WIRE.push({
  id:'yagi', num:'1.9', lvl:3,
  desc:{en:"A driven dipole with a reflector behind it and one or more directors in front. The parasitic elements re-radiate with phases that reinforce forward and cancel backward, forming an endfire beam. Add directors and the beam sharpens — watch the schematic and the pattern change together.",
        uk:"Активний диполь із рефлектором позаду й одним чи кількома директорами попереду. Пасивні елементи перевипромінюють із фазами, що підсилюють уперед і гасять назад, формуючи осьовий промінь. Додайте директорів — промінь звужується; схема й ДН змінюються разом."},
  methods:[{id:'nec', en:'Endfire array model (MoM/NEC)', uk:'Модель осьової решітки (MoM/NEC)',
     desc:{en:"A real Yagi is solved with MoM/NEC because the parasitic currents come from mutual coupling. This calculator models the boom as an ordinary endfire array (reflector + driven + N directors) — the element count drives both the schematic and the directivity, computed by integrating the array factor.",
           uk:"Реальну Yagi рахують MoM/NEC, бо пасивні струми виникають із взаємного зв'язку. Цей калькулятор моделює стрілу як звичайну осьову решітку (рефлектор + активний + N директорів) — число елементів керує і схемою, і спрямованістю, обчисленою інтегруванням множника решітки."},
     formula:[{en:"AF(γ) = Σ wₙ·exp[j·2π·zₙ·(cosγ − 1)],   γ from boom axis",
               uk:"AF(γ) = Σ wₙ·exp[j·2π·zₙ·(cosγ − 1)],   γ від осі стріли"},
              {en:"D = 2 / ∫₀^π |AF(γ)|²·sinγ dγ   (boom-symmetric)",
               uk:"D = 2 / ∫₀^π |AF(γ)|²·sinγ dγ   (симетрія по стрілі)"}]}],
  controls:[
    {id:'f',kind:'freq',en:'Frequency f',uk:'Частота f',fmin:1,fmax:10000,value:0.6},
    {id:'ndir', kind:'range', en:'Directors', uk:'Директорів', min:0, max:20, step:1, value:5, fmt:v=>v.toFixed(0)},
    {id:'sdir', kind:'range', en:'Director spacing', uk:'Крок директорів', min:0.1, max:0.4, step:0.01, value:0.2, fmt:v=>v.toFixed(2)+' λ'},
    {id:'sref', kind:'range', en:'Reflector spacing', uk:'Відстань рефлектора', min:0.1, max:0.35, step:0.01, value:0.25, fmt:v=>v.toFixed(2)+' λ'}
  ],
  plot:'full',
  compute(s){
    const lamCm=AL.lambdaOf(s.f*1e9)*100;
    // element positions (λ): reflector at -sref, driven 0, directors +k*sdir
    const pos=[-s.sref, 0]; const w=[1.0,1.0];
    for(let kk=1;kk<=s.ndir;kk++){ pos.push(kk*s.sdir); w.push(Math.max(0.55,1-0.03*kk)); }
    const AF=g=>{ let re=0,im=0,sw=0; for(let n=0;n<pos.length;n++){ const ph=2*Math.PI*pos[n]*(Math.cos(g)-1);
      re+=w[n]*Math.cos(ph); im+=w[n]*Math.sin(ph); sw+=w[n]; } return Math.hypot(re,im)/sw; };
    const fnBeam=a=>AF(a*AL.D2R);
    const D=AL.directivityAxial(g=>AF(g));
    const samp=AL.sampleHalf(fnBeam,0.25,180);
    const hp=AL.findHPBW(samp,fnBeam);
    const fb=20*Math.log10((fnBeam(0)+1e-9)/(fnBeam(180)+1e-9));
    const boom=(pos[pos.length-1]-pos[0]);
    // schematic: boom with elements. reflector longest, directors shortest.
    const px=scaleFor(boom*lamCm+ s.sref*lamCm, 300), y=125, x0=50;
    const zpx=z=>x0+(z-pos[0])*lamCm*px;
    const half=(len)=>len*lamCm*px*0.5;
    // E: the vertical plane through the boom — elements stand up in it.
    // H: looking down on the same boom — every element is now end-on.
    let schemE=AL.rulerSVG(40,28,lamCm,px)+AL.CAP_E();
    schemE+=`<line class="schem-wire-dim" x1="${zpx(pos[0])}" y1="${y}" x2="${zpx(pos[pos.length-1])}" y2="${y}"/>`;
    schemE+=`<line class="schem-wire" x1="${zpx(pos[0])}" y1="${y-half(0.52)}" x2="${zpx(pos[0])}" y2="${y+half(0.52)}"/>`;
    schemE+=`<line class="schem-driven" x1="${zpx(0)}" y1="${y-half(0.48)}" x2="${zpx(0)}" y2="${y+half(0.48)}"/>`;
    schemE+=`<circle class="schem-node" cx="${zpx(0)}" cy="${y}" r="2.5"/>`;
    for(let kk=1;kk<=s.ndir;kk++){ const z=kk*s.sdir; schemE+=`<line class="schem-wire" x1="${zpx(z)}" y1="${y-half(0.45)}" x2="${zpx(z)}" y2="${y+half(0.45)}"/>`; }
    schemE+=`<text class="schem-label" x="${zpx(pos[0])}" y="${y+half(0.52)+13}" text-anchor="middle">R</text>`;
    schemE+=`<text class="schem-label" x="${zpx(0)}" y="${y+half(0.48)+13}" text-anchor="middle">D</text>`;
    schemE+=AL.boresightArrow(zpx(pos[pos.length-1])+8,y,30,V,'yagiE');
    schemE+=`<text class="schem-label" x="${x0}" y="${y-half(0.52)-8}">${s.ndir} ${AL.tr('directors','директорів')} · boom ${boom.toFixed(2)} λ</text>`;
    let schemH=AL.rulerSVG(40,28,lamCm,px)+AL.CAP_H();
    schemH+=`<line class="schem-wire-dim" x1="${zpx(pos[0])}" y1="${y}" x2="${zpx(pos[pos.length-1])}" y2="${y}"/>`;
    schemH+=AL.conductorEndOn(zpx(pos[0]),y,6);
    schemH+=AL.conductorEndOn(zpx(0),y,6);
    for(let kk=1;kk<=s.ndir;kk++) schemH+=AL.conductorEndOn(zpx(kk*s.sdir),y,4.5);
    schemH+=AL.boresightArrow(zpx(pos[pos.length-1])+10,y,30,A,'yagiH');
    schemH+=`<text class="schem-label" x="${zpx(pos[0])}" y="${y+22}" text-anchor="middle">R</text>`;
    schemH+=`<text class="schem-label" x="${zpx(0)}" y="${y+22}" text-anchor="middle">D</text>`;
    schemH+=`<text class="schem-label" x="${x0}" y="${y-26}">${AL.tr('elements end-on along the boom','елементи з торця вздовж стріли')}</text>`;
    // scan the model itself for the spacings that maximise directivity
    const dirFor=(sd,sr)=>{
      const pp=[-sr,0], ww=[1,1];
      for(let kk=1;kk<=s.ndir;kk++){ pp.push(kk*sd); ww.push(Math.max(0.55,1-0.03*kk)); }
      const af=g=>{ let re=0,im=0,sw=0;
        for(let n=0;n<pp.length;n++){ const ph=2*Math.PI*pp[n]*(Math.cos(g)-1);
          re+=ww[n]*Math.cos(ph); im+=ww[n]*Math.sin(ph); sw+=ww[n]; }
        return Math.hypot(re,im)/sw; };
      let sum=0; const NQ=120;
      for(let i=0;i<=NQ;i++){ const th=Math.PI*i/NQ, v=af(th);
        sum+=(i===0||i===NQ?1:(i%2?4:2))*v*v*Math.sin(th); }
      sum*=(Math.PI/NQ)/3;
      return sum>1e-9 ? 2/sum : 0;
    };
    const sdOpt=AL.argMax(x=>dirFor(x,s.sref), 0.10, 0.40, 14);
    const srOpt=AL.argMax(x=>dirFor(s.sdir,x), 0.10, 0.35, 12);
    const optima=[
      {id:'sdir', value:sdOpt, tag:'h',
       label:AL.tr(`director spacing \u2248 ${sdOpt.toFixed(2)} \u03bb for peak gain with ${s.ndir} directors`,
                   `\u043a\u0440\u043e\u043a \u0434\u0438\u0440\u0435\u043a\u0442\u043e\u0440\u0456\u0432 \u2248 ${sdOpt.toFixed(2)} \u03bb \u0434\u043b\u044f \u043c\u0430\u043a\u0441\u0438\u043c\u0443\u043c\u0443`)},
      {id:'sref', value:srOpt, tag:'e',
       label:AL.tr(`reflector spacing \u2248 ${srOpt.toFixed(2)} \u03bb`,
                   `\u0432\u0456\u0434\u0441\u0442\u0430\u043d\u044c \u0440\u0435\u0444\u043b\u0435\u043a\u0442\u043e\u0440\u0430 \u2248 ${srOpt.toFixed(2)} \u03bb`)}
    ];
    return {schemE, schemH, fnBeam, optima,
      meta3d:{lamCm, sizeLam:boom, sizeLabel:'boom = '+boom.toFixed(2)+' λ', gainDbi:D.dBi},
      readouts:[
        {k:AL.tr('Directivity','Спрямованість'), v:D.dBi.toFixed(1)+' '+AL.unit('dBi')},
        {k:'HPBW', v:AL.fmtDeg(hp)},
        {k:'F/B', v:fb.toFixed(1)+' '+AL.unit('dB')},
        {k:AL.tr('Elements','Елементів'), v:(2+s.ndir).toFixed(0)}
      ]};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Yagi%E2%80%93Uda_antenna',label:'Yagi-Uda antenna'}, uk:{href:'https://uk.wikipedia.org/wiki/Антена_Уда-Ягі',label:'Антена Уда-Яги'}},
    {tag:'code', en:{href:'https://www.nec2.org/',label:'NEC-2'}},
    {tag:'nist', en:{href:'https://nvlpubs.nist.gov/nistpubs/Legacy/TN/nbstechnicalnote688.pdf',label:'Viezbicke NBS TN-688'}}
  ],
  strength:{en:"Cheap, rugged, 10–17 dBi — the definitive TV/point-to-point antenna. Gain rises roughly with the log of boom length, so doubling elements adds only a few dB; bandwidth is narrow because the parasitics are resonant.",
            uk:"Дешева, міцна, 10–17 дБі — еталонна ТБ / «точка-точка» антена. Підсилення росте приблизно як логарифм довжини стріли, тож подвоєння елементів додає лише кілька дБ; смуга вузька через резонансні пасивні елементи."},
  xrefs:[['#dipole','Dipole','Диполь'],['#lpda','Log-periodic','Логоперіодична'],['array.html#stacked-yagi','Stacked Yagi','Стекована Yagi']]
});

/* ---- 1.10 LPDA ------------------------------------------------------- */
WIRE.push({
  id:'lpda', num:'1.10', lvl:3,
  desc:{en:"A row of dipoles whose lengths and spacings scale by a constant ratio τ. At any frequency only the near-resonant dipoles (the 'active region') radiate, so the pattern and impedance stay almost constant over a huge band — a frequency-independent antenna.",
        uk:"Ряд диполів, довжини й відстані яких масштабуються сталим коефіцієнтом τ. На будь-якій частоті випромінюють лише близькі до резонансу диполі («активна ділянка»), тож ДН та опір майже сталі у величезній смузі — частотно-незалежна антена."},
  methods:[{id:'nec', en:'Scaled-dipole model (MoM/NEC)', uk:'Модель масштабованих диполів (MoM/NEC)',
     desc:{en:"The full set is solved with MoM. The design geometry follows Carrel: the scale factor τ and spacing factor σ fix the apex angle, the active-region size and hence the directivity. This calculator draws the τ-scaled dipoles and estimates gain from τ and σ.",
           uk:"Повний набір рахують MoM. Геометрія за Каррелом: коефіцієнти τ і σ задають кут розкриву, розмір активної ділянки й спрямованість. Калькулятор малює τ-масштабовані диполі й оцінює підсилення з τ та σ."},
     formula:[{en:"L_{n+1}=τ·Lₙ,  d_{n+1}=τ·dₙ,  σ = dₙ/(2·L_{n+1}),  cot α = 4σ/(1−τ)",
               uk:"L_{n+1}=τ·Lₙ,  d_{n+1}=τ·dₙ,  σ = dₙ/(2·L_{n+1}),  cot α = 4σ/(1−τ)"}]}],
  controls:[
    {id:'f',kind:'freq',en:'Frequency f',uk:'Частота f',fmin:1,fmax:10000,value:0.3},
    {id:'Ndip', kind:'range', en:'Dipoles N', uk:'Диполів N', min:4, max:20, step:1, value:9, fmt:v=>v.toFixed(0)},
    {id:'tau', kind:'range', en:'Scale τ', uk:'Масштаб τ', min:0.8, max:0.96, step:0.005, value:0.88, fmt:v=>v.toFixed(3)},
    {id:'sigma', kind:'range', en:'Spacing σ', uk:'Розрідж. σ', min:0.05, max:0.22, step:0.005, value:0.15, fmt:v=>v.toFixed(3)}
  ],
  plot:'full',
  compute(s){
    // Carrel directivity approximation (rises with τ→1 and optimal σ)
    const Dlin=1.1+ 7.7*Math.pow(s.tau,1)* (1 - Math.pow((s.sigma-0.165)/0.16,2)*0.5);
    const G=10*Math.log10(Math.max(Dlin,1.3))+ (s.tau-0.8)*10;
    const bwRatio=Math.pow(1/s.tau, s.Ndip-1); // frequency ratio spanned
    // active-region endfire pattern (toward apex/short end = up)
    const nAct=3; const fnBeam=a=>{ const g=a*AL.D2R;
      let re=0,im=0; for(let n=0;n<nAct;n++){ const z=n*0.15; const ph=2*Math.PI*z*(Math.cos(g)-1)+Math.PI*n;
        re+=Math.cos(ph); im+=Math.sin(ph);} const af=Math.hypot(re,im)/nAct;
      return af*Math.abs(AL.dipolePattern(Math.max((90-a)*AL.D2R,1e-3),0.5)*0.5+0.5); };
    // schematic: N dipoles of scaled length along a boom, apex to the right(up)
    const y=125, x0=350; let L0=95; const px=1; // longest at left
    let xs=[], Ls=[], x=x0, Lp=L0;
    for(let n=0;n<s.Ndip;n++){ xs.push(x); Ls.push(Lp); const d=2*s.sigma*Lp; x-=d; Lp*=s.tau; }
    const lamCmL=AL.lambdaOf(s.f*1e9)*100, pxL=L0/(0.5*lamCmL);
    let schemE=AL.rulerSVG(40,28,lamCmL,pxL)+AL.CAP_E();
    schemE+=`<line class="schem-wire-dim" x1="${xs[xs.length-1]}" y1="${y}" x2="${xs[0]}" y2="${y}"/>`;
    for(let n=0;n<s.Ndip;n++){ const h=Ls[n]/2;
      schemE+=`<line class="${(n===Math.floor(s.Ndip*0.55))?'schem-driven':'schem-wire'}" x1="${xs[n]}" y1="${y-h}" x2="${xs[n]}" y2="${y+h}"/>`; }
    schemE+=AL.boresightArrow(xs[xs.length-1]-38,y,30,V,'lpdaE');
    schemE+=`<text class="schem-label" x="${x0-40}" y="${y-56}">τ = ${s.tau.toFixed(3)} · N = ${s.Ndip}</text>`;
    schemE+=`<text class="schem-label" x="${xs[xs.length-1]-40}" y="${y+50}">${AL.tr('apex / high f','вершина / вис. f')}</text>`;
    let schemH=AL.rulerSVG(40,28,lamCmL,pxL)+AL.CAP_H();
    schemH+=`<line class="schem-wire-dim" x1="${xs[xs.length-1]}" y1="${y}" x2="${xs[0]}" y2="${y}"/>`;
    for(let n=0;n<s.Ndip;n++) schemH+=AL.conductorEndOn(xs[n],y,Math.max(2.6,Ls[n]/22));
    schemH+=AL.boresightArrow(xs[xs.length-1]-40,y,30,A,'lpdaH');
    schemH+=`<text class="schem-label" x="${x0-40}" y="${y-30}">${AL.tr('scaled dipoles end-on, longest at the rear','масштабовані диполі з торця, найдовший ззаду')}</text>`;
    // Carrel's optimum spacing factor for the chosen scale factor tau
    const sgOpt=0.258*s.tau-0.066;
    const optima=[{id:'sigma', value:sgOpt, tag:'h',
      label:AL.tr(`σ ≈ ${sgOpt.toFixed(3)} — Carrel optimum for τ = ${s.tau.toFixed(3)}`,
                  `σ ≈ ${sgOpt.toFixed(3)} — оптимум Каррела`)}];
    return {schemE, schemH, fnBeam, optima,
      meta3d:{lamCm:AL.lambdaOf(s.f*1e9)*100, sizeLam:(xs[0]-xs[s.Ndip-1])/L0*0.5, sizeLabel:'boom ≈ '+((xs[0]-xs[s.Ndip-1])/L0*0.5).toFixed(2)+' λ_max', gainDbi:G},
      readouts:[
        {k:AL.tr('Directivity','Спрямованість'), v:G.toFixed(1)+' '+AL.unit('dBi')},
        {k:AL.tr('Band ratio','Смуга f_max/f_min'), v:bwRatio.toFixed(1)+':1'},
        {k:AL.tr('Apex angle α','Кут α'), v:(Math.atan(4*s.sigma/(1-s.tau))*AL.R2D).toFixed(0)+'°'},
        {k:AL.tr('Dipoles','Диполів'), v:s.Ndip.toFixed(0)}
      ]};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Log-periodic_antenna',label:'Log-periodic antenna'}},
    {tag:'paper', en:{href:'https://doi.org/10.1109/TAP.1961.1138041',label:'Carrel, LPDA design (1961)'}}
  ],
  strength:{en:"Constant gain and impedance over 10:1 or wider bandwidths make LPDAs the workhorse of EMC test ranges and wideband monitoring. Gain is modest (6–11 dBi) — the price of frequency independence — and only the active region radiates at any instant.",
            uk:"Стале підсилення й опір у смузі 10:1 і ширше роблять LPDA основою EMC-полігонів і широкосмугового моніторингу. Підсилення помірне (6–11 дБі) — плата за частотну незалежність; випромінює лише активна ділянка."},
  xrefs:[['#yagi','Yagi-Uda','Уда-Яги'],['#dipole','Dipole','Диполь'],['array.html#stacked-yagi','Arrays','Решітки']]
});

/* ---- 1.11 Discone ---------------------------------------------------- */
WIRE.push({
  id:'discone', num:'1.11', lvl:3,
  desc:{en:"A disc above a cone. The tapered geometry has no single resonance, so it works from a low cutoff (set by the cone slant ≈ λ/4) up over a decade with a near-constant 50 Ω match and a vertically-polarised, omnidirectional, slightly downtilted pattern.",
        uk:"Диск над конусом. Звужена геометрія не має єдиного резонансу, тож працює від нижньої межі (нахил конуса ≈ λ/4) на декаду вгору з майже сталим узгодженням 50 Ом і вертикально-поляризованою всенаправленою, злегка нахиленою ДН."},
  methods:[{id:'bor', en:'Body-of-revolution MoM', uk:'MoM тіл обертання',
     desc:{en:"The axisymmetric geometry is efficiently solved by body-of-revolution MoM. The key design number is the low-frequency cutoff, where the cone slant height reaches a quarter wavelength; above it the antenna is broadband.",
           uk:"Осесиметричну геометрію ефективно розв'язує MoM тіл обертання. Ключове число — нижня межа, де нахилена висота конуса сягає чверті хвилі; вище антена широкосмугова."},
     formula:[{en:"f_low ≈ c / (4·L_slant),   bandwidth typically > 10:1",
               uk:"f_low ≈ c / (4·L_нахилу),   смуга зазвичай > 10:1"}]}],
  controls:[
    {id:'f',kind:'freq',en:'Frequency f',uk:'Частота f',fmin:1,fmax:10000,value:0.5},
    {id:'slant', kind:'range', en:'Cone slant L', uk:'Нахил конуса L', min:50, max:600, step:5, value:170, fmt:v=>v.toFixed(0)+' '+AL.unit('mm')},
    {id:'angle', kind:'range', en:'Cone half-angle', uk:'Півкут конуса', min:20, max:45, step:1, value:30, fmt:v=>v.toFixed(0)+'°'}
  ],
  plot:'full',
  compute(s){
    const flowHz=AL.c/(4*s.slant/1000), flow=flowHz/1e9;
    const above=s.f>=flow;
    const octaves=Math.log2(3/Math.max(flow,0.001));
    // pattern: omni in azimuth; elevation lobe tilted down slightly (monopole-like), main near horizon
    const fnBeam=a=>{ // 0=up(zenith). Max near horizon (a=90..110)
      const el=a; const lobe=Math.exp(-Math.pow((el-95)/38,2))+0.15*Math.exp(-Math.pow((el-265)/40,2));
      return AL.clamp(lobe,0,1); };
    const cx=190, apex=205, slantPx=Math.min(s.slant*0.28,110), ha=s.angle*AL.D2R;
    const dx=slantPx*Math.sin(ha), dy=slantPx*Math.cos(ha);
    const lamCmD=AL.lambdaOf(s.f*1e9)*100, pxD=Math.min(140/lamCmD,10);
    const discY=apex-dy-14, discR=dx*1.05;
    let schemE=AL.rulerSVG(40,26,lamCmD,pxD)+AL.CAP_E();
    schemE+=`<path class="schem-fill" d="M ${cx},${apex} L ${cx-dx},${apex-dy} L ${cx+dx},${apex-dy} Z"/>`;
    schemE+=`<ellipse class="schem-driven" cx="${cx}" cy="${discY}" rx="${discR}" ry="6"/>`;
    schemE+=`<line class="schem-driven" x1="${cx}" y1="${apex}" x2="${cx}" y2="${discY}"/>`;
    schemE+=`<circle class="schem-node" cx="${cx}" cy="${apex-dy-2}" r="2.5"/>`;
    schemE+=AL.dimLineV(cx+dx+20,apex-dy,apex,`L = ${s.slant} ${AL.unit('mm')}`);
    schemE+=`<text class="schem-label" x="${cx-discR}" y="${discY-8}">${AL.tr('disc','диск')}</text>`;
    schemE+=`<text class="schem-label" x="${cx+dx+4}" y="${apex}">${AL.tr('cone','конус')}</text>`;
    schemE+=AL.boresightArrow(cx+dx+34,apex-dy*0.4,28,V,'dcE');
    // plan: concentric — the disc over the base of the cone
    const cyH=125;
    let schemH=AL.rulerSVG(40,26,lamCmD,pxD)+AL.CAP_H();
    schemH+=AL.azimuthCircle(cx,cyH,Math.max(dx+30,58),A);
    schemH+=`<circle class="schem-fill" cx="${cx}" cy="${cyH}" r="${dx}"/>`;
    schemH+=`<circle class="schem-driven" cx="${cx}" cy="${cyH}" r="${discR}" fill="none"/>`;
    schemH+=AL.conductorEndOn(cx,cyH,4);
    schemH+=AL.boresightArrow(cx+8,cyH,Math.max(dx+34,62),A,'dcH');
    schemH+=`<text class="schem-label" x="${cx}" y="${cyH+Math.max(dx+30,58)+18}" text-anchor="middle">${AL.tr('disc over cone base · omni','диск над основою конуса · всенапр.')}</text>`;
    return {schemE, schemH, fnBeam,
      meta3d:{lamCm:AL.lambdaOf(s.f*1e9)*100, sizeLam:(s.slant/10)/(AL.lambdaOf(s.f*1e9)*100), sizeLabel:'L = '+((s.slant/10)/(AL.lambdaOf(s.f*1e9)*100)).toFixed(2)+' λ'},
      readouts:[
        {k:AL.tr('Low cutoff','Нижня межа'), v:flow.toFixed(3)+' '+AL.unit('GHz')},
        {k:AL.tr('In band?','У смузі?'), v:above?AL.tr('yes','так'):AL.tr('below cutoff','нижче межі')},
        {k:AL.tr('Bandwidth','Смуга'), v:'> 10:1'},
        {k:AL.tr('Directivity','Спрямованість'), v:'≈ 2–4 '+AL.unit('dBi')}
      ]};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Discone_antenna',label:'Discone antenna'}}
  ],
  strength:{en:"A single discone covers a scanner's whole VHF/UHF range with no tuning — unbeatable for wideband monitoring. Gain is low (it is omnidirectional) and it is vertically polarised only.",
            uk:"Один дискоконус покриває весь діапазон VHF/UHF сканера без налаштування — неперевершений для широкосмугового моніторингу. Підсилення низьке (всенаправлена), поляризація лише вертикальна."},
  xrefs:[['#monopole','Monopole','Монополь'],['aperture.html#biconical','Biconical','Біконічна'],['#collinear','Collinear','Колінеарна'] ]
});

/* ---- 1.12 Rhombic ---------------------------------------------------- */
WIRE.push({
  id:'rhombic', num:'1.12', lvl:1,
  desc:{en:"Four long wires arranged as a diamond and terminated in a resistor at the far apex. Each leg carries a traveling wave; the four beams combine into a strong, low-angle, unidirectional lobe toward the termination — the classic long-haul HF antenna.",
        uk:"Чотири довгі проводи у формі ромба з узгоджувальним резистором на дальній вершині. Кожне плече несе біжучу хвилю; чотири промені складаються в сильну низькокутну односпрямовану пелюстку до навантаження — класична далека КХ-антена."},
  methods:[{id:'tw', en:'Traveling-wave theory', uk:'Теорія біжучої хвилі',
     desc:{en:"With a matched termination there is no reflected wave, so each leg is a traveling-wave long-wire radiator. The array of four legs is designed so their maxima align at the wanted elevation; the tilt (leg) angle and leg length set the beam.",
           uk:"З узгодженим навантаженням відбитої хвилі немає, тож кожне плече — довгопровідний випромінювач біжучої хвилі. Чотири плечі проєктують так, щоб максимуми збіглися на потрібному куті місця; кут нахилу й довжина плеча задають промінь."},
     formula:[{en:"long wire:  |F| = |sin(π·ℓ/λ·(1−cosψ)) / (1−cosψ)|,  ℓ = leg length",
               uk:"довгий провід:  |F| = |sin(π·ℓ/λ·(1−cosψ)) / (1−cosψ)|,  ℓ = довжина плеча"}]}],
  controls:[
    {id:'f',kind:'freq',en:'Frequency f',uk:'Частота f',fmin:1,fmax:10000,value:0.014},
    {id:'leg', kind:'range', en:'Leg length ℓ', uk:'Довжина плеча ℓ', min:1, max:8, step:0.1, value:4, fmt:v=>v.toFixed(1)+' λ'},
    {id:'tilt', kind:'range', en:'Tilt angle', uk:'Кут нахилу', min:40, max:80, step:1, value:70, fmt:v=>v.toFixed(0)+'°'}
  ],
  plot:'full',
  compute(s){
    const L=s.leg;
    // long-wire traveling-wave pattern = element factor sinθ × traveling-wave
    // array factor sinc[(πL/λ)(1−cosθ)]. θ measured from the wire axis.
    const lw=psi=>{ const u=1-Math.cos(psi), arg=Math.PI*L*u;
      const sc=Math.abs(u)<1e-9?1:Math.sin(arg)/arg; return Math.abs(Math.sin(psi))*Math.abs(sc); };
    const fnBeam=a=>lw(a*AL.D2R);
    const D=AL.directivityAxial(g=>lw(Math.max(g,1e-3)));
    const an=AL.analyzePattern(fnBeam,90,0.25);   // main lobe is off-axis
    // A rhombic is a horizontal wire diamond slung above ground: the diamond
    // shape only exists in PLAN, and the elevation shows it as one flat span.
    const cx=190, cy=118, halfW=88, halfH=Math.min(20+L*8,64);
    const lamCmB=AL.lambdaOf(s.f*1e9)*100, pxB=halfW/(L*lamCmB)*2;
    let schemH=AL.rulerSVG(40,26,lamCmB,pxB)+AL.CAP_H();
    schemH+=`<path class="schem-driven" d="M ${cx-halfW},${cy} L ${cx},${cy-halfH} L ${cx+halfW},${cy} L ${cx},${cy+halfH} Z"/>`;
    schemH+=`<circle class="schem-node" cx="${cx-halfW}" cy="${cy}" r="2.5"/>`;
    schemH+=`<rect class="schem-fill" x="${cx+halfW-3}" y="${cy-6}" width="12" height="12"/>`;
    schemH+=`<text class="schem-label" x="${cx+halfW+2}" y="${cy-9}">R_term</text>`;
    schemH+=`<text class="schem-label" x="${cx-halfW-30}" y="${cy+3}">${AL.tr('feed','живл.')}</text>`;
    schemH+=AL.boresightArrow(cx+halfW+16,cy,26,A,'rhH');
    schemH+=`<text class="schem-label" x="${cx-20}" y="${cy-halfH-8}">ℓ = ${L.toFixed(1)} λ ${AL.tr('per leg','на плече')}</text>`;
    const gyR=180, hR=34;
    let schemE=AL.rulerSVG(40,26,lamCmB,pxB)+AL.CAP_E();
    schemE+=AL.groundHatch(cx-halfW-16,cx+halfW+22,gyR);
    schemE+=`<line class="schem-driven" x1="${cx-halfW}" y1="${gyR-hR}" x2="${cx+halfW}" y2="${gyR-hR}"/>`;
    schemE+=`<line class="schem-wire-dim" x1="${cx-halfW}" y1="${gyR-hR}" x2="${cx-halfW}" y2="${gyR}"/>`;
    schemE+=`<line class="schem-wire-dim" x1="${cx+halfW}" y1="${gyR-hR}" x2="${cx+halfW}" y2="${gyR}"/>`;
    schemE+=`<circle class="schem-node" cx="${cx-halfW}" cy="${gyR-hR}" r="2.5"/>`;
    schemE+=`<rect class="schem-fill" x="${cx+halfW-3}" y="${gyR-hR-6}" width="12" height="12"/>`;
    schemE+=`<text class="schem-label" x="${cx-halfW-8}" y="${gyR-hR-10}">${AL.tr('both legs superimposed','обидва плеча збігаються')}</text>`;
    schemE+=AL.dimLineV(cx+halfW+30,gyR-hR,gyR,AL.tr('height','висота'));
    schemE+=`<defs><marker id="ar-rhE" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" style="fill:${V}"/></marker></defs>`;
    schemE+=`<line style="stroke:${V};stroke-width:1.6" x1="${cx+halfW}" y1="${gyR-hR}" x2="${(cx+halfW+52).toFixed(1)}" y2="${(gyR-hR-52*Math.tan(an.peakDeg*AL.D2R)).toFixed(1)}" marker-end="url(#ar-rhE)"/>`;
    schemE+=`<text class="schem-label" style="fill:${V}" x="${cx+halfW+18}" y="${gyR-hR-30}">${an.peakDeg.toFixed(0)}°</text>`;
    return {schemE, schemH, fnBeam,
      meta3d:{lamCm:AL.lambdaOf(s.f*1e9)*100, sizeLam:L, sizeLabel:'ℓ = '+L.toFixed(1)+' λ per leg', gainDbi:D.dBi},
      readouts:[
        {k:AL.tr('Directivity','Спрямованість'), v:D.dBi.toFixed(1)+' '+AL.unit('dBi')},
        {k:AL.tr('Beam elevation','Кут пелюстки'), v:an.peakDeg.toFixed(0)+'° '+AL.tr('from axis','від осі')},
        {k:AL.tr('Lobe HPBW','Ширина пел.'), v:an.hpbw.toFixed(0)+'°'},
        {k:AL.tr('Termination','Навантаження'), v:'600–800 '+AL.unit('ohm')}
      ]};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Rhombic_antenna',label:'Rhombic antenna'}},
    {tag:'book', en:{href:'https://archive.org/details/radioantennaengi00lapo',label:'Laport, Radio Antenna Engineering'}}
  ],
  strength:{en:"Very high gain (up to ~17 dBi) and broadband — the mainstay of pre-satellite intercontinental shortwave. The cost is a large plot of land and ~1/3 of the power dissipated in the terminating resistor.",
            uk:"Дуже високе підсилення (до ~17 дБі) й широкосмуговість — основа досупутникового міжконтинентального КХ. Ціна — велика ділянка землі та ~1/3 потужності, розсіяної в резисторі."},
  xrefs:[['#beverage','Beverage','Бевереджа'],['travelingwave.html#leaky-wave','Traveling-wave','Біжуча хвиля'],['#lpda','Log-periodic','Логоперіодична']]
});

/* ---- 1.13 Beverage --------------------------------------------------- */
WIRE.push({
  id:'beverage', num:'1.13', lvl:1,
  desc:{en:"A long wire, a fraction of a wavelength above ground, terminated at the far end. The wave tilt of the ground pulls a small horizontal field component that the wire integrates over its length — a superb directional receiving antenna for the low bands, poor as a transmitter.",
        uk:"Довгий провід, на частку хвилі над землею, узгоджений на дальньому кінці. Нахил фронту земної хвилі дає малу горизонтальну складову, яку провід інтегрує по довжині — чудова приймальна спрямована антена для НЧ-діапазонів, погана для передачі."},
  methods:[{id:'tw', en:'Traveling-wave (ground-wave)', uk:'Біжуча хвиля (земна хвиля)',
     desc:{en:"The forward-fired traveling wave adds in phase with the tilted ground wave along the wire. Directivity grows with length up to an optimum; beyond it the pattern breaks into lobes. Height and ground quality set the wave-tilt coupling.",
           uk:"Біжуча хвиля вперед складається у фазі з нахиленою земною хвилею вздовж проводу. Спрямованість росте з довжиною до оптимуму; далі ДН розпадається на пелюстки. Висота й якість ґрунту задають зв'язок із нахилом фронту."},
     formula:[{en:"|F| = |sin(π·ℓ/λ·(1−cosψ)) / (1−cosψ)|,   optimum ℓ ≈ 1–3 λ",
               uk:"|F| = |sin(π·ℓ/λ·(1−cosψ)) / (1−cosψ)|,   оптимум ℓ ≈ 1–3 λ"}]}],
  controls:[
    {id:'f',kind:'freq',en:'Frequency f',uk:'Частота f',fmin:1,fmax:10000,value:0.007},
    {id:'len', kind:'range', en:'Wire length ℓ', uk:'Довжина ℓ', min:0.5, max:6, step:0.1, value:2, fmt:v=>v.toFixed(1)+' λ'},
    {id:'h', kind:'range', en:'Height above ground', uk:'Висота над землею', min:0.005, max:0.1, step:0.005, value:0.02, fmt:v=>v.toFixed(3)+' λ'}
  ],
  plot:'full',
  compute(s){
    const L=s.len;
    const lw=psi=>{ const u=1-Math.cos(psi), arg=Math.PI*L*u;
      const sc=Math.abs(u)<1e-9?1:Math.sin(arg)/arg; return Math.abs(Math.sin(psi))*Math.abs(sc); };
    const fnBeam=a=>lw(a*AL.D2R);
    const D=AL.directivityAxial(g=>lw(Math.max(g,1e-3)));
    const an=AL.analyzePattern(fnBeam,90,0.25);   // main lobe is off-axis
    const cx=190, gy=175, Lpx=170, hpx=Math.max(s.h*600,10);
    const lamCmV=AL.lambdaOf(s.f*1e9)*100, pxV=Lpx/(L*lamCmV);
    let schemE=AL.rulerSVG(40,26,lamCmV,pxV)+AL.CAP_E();
    schemE+=AL.groundHatch(cx-Lpx/2-14,cx+Lpx/2+22,gy);
    schemE+=`<line class="schem-driven" x1="${cx-Lpx/2}" y1="${gy-hpx}" x2="${cx+Lpx/2}" y2="${gy-hpx}"/>`;
    schemE+=`<line class="schem-wire-dim" x1="${cx-Lpx/2}" y1="${gy-hpx}" x2="${cx-Lpx/2}" y2="${gy}"/>`;
    schemE+=`<circle class="schem-node" cx="${cx-Lpx/2}" cy="${gy}" r="2.5"/>`;
    schemE+=`<rect class="schem-fill" x="${cx+Lpx/2-3}" y="${gy-hpx-5}" width="10" height="10"/>`;
    schemE+=`<text class="schem-label" x="${cx+Lpx/2+8}" y="${gy-hpx-6}">R</text>`;
    schemE+=AL.dimLineV(cx-Lpx/2-18,gy-hpx,gy,`h`);
    schemE+=AL.dimLineH(cx-Lpx/2,cx+Lpx/2,gy+26,`ℓ = ${L.toFixed(1)} λ`);
    schemE+=`<defs><marker id="ar-bevE" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" style="fill:${V}"/></marker></defs>`;
    schemE+=`<line style="stroke:${V};stroke-width:1.6" x1="${cx+Lpx/2}" y1="${gy-hpx}" x2="${(cx+Lpx/2+50).toFixed(1)}" y2="${(gy-hpx-50*Math.tan(an.peakDeg*AL.D2R)).toFixed(1)}" marker-end="url(#ar-bevE)"/>`;
    schemE+=`<text class="schem-label" style="fill:${V}" x="${cx+Lpx/2+16}" y="${gy-hpx-28}">${an.peakDeg.toFixed(0)}°</text>`;
    // plan: one straight wire, feed one end, terminator the other
    const cyH=125;
    let schemH=AL.rulerSVG(40,26,lamCmV,pxV)+AL.CAP_H();
    schemH+=`<line class="schem-driven" x1="${cx-Lpx/2}" y1="${cyH}" x2="${cx+Lpx/2}" y2="${cyH}"/>`;
    schemH+=`<circle class="schem-node" cx="${cx-Lpx/2}" cy="${cyH}" r="3"/>`;
    schemH+=`<rect class="schem-fill" x="${cx+Lpx/2-3}" y="${cyH-5}" width="10" height="10"/>`;
    schemH+=`<text class="schem-label" x="${cx-Lpx/2-6}" y="${cyH-10}">${AL.tr('feed','живл.')}</text>`;
    schemH+=`<text class="schem-label" x="${cx+Lpx/2+8}" y="${cyH-6}">R_term</text>`;
    schemH+=AL.boresightArrow(cx+Lpx/2+18,cyH,26,A,'bevH');
    schemH+=AL.dimLineH(cx-Lpx/2,cx+Lpx/2,cyH+30,`ℓ = ${L.toFixed(1)} λ`);
    return {schemE, schemH, fnBeam,
      meta3d:{lamCm:AL.lambdaOf(s.f*1e9)*100, sizeLam:L, sizeLabel:'ℓ = '+L.toFixed(1)+' λ', gainDbi:D.dBi},
      readouts:[
        {k:AL.tr('Directivity','Спрямованість'), v:D.dBi.toFixed(1)+' '+AL.unit('dBi')},
        {k:AL.tr('Beam elevation','Кут пелюстки'), v:an.peakDeg.toFixed(0)+'° '+AL.tr('from axis','від осі')},
        {k:AL.tr('Lobe HPBW','Ширина пел.'), v:an.hpbw.toFixed(0)+'°'},
        {k:AL.tr('Use','Застосування'), v:AL.tr('receive only','лише прийом')}
      ]};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Beverage_antenna',label:'Beverage antenna'}}
  ],
  strength:{en:"Unbeatable signal-to-noise on 160/80 m receive because it rejects high-angle noise and is directional; efficiency is terrible (most power lost in ground/termination) so it is never used to transmit.",
            uk:"Неперевершене співвідношення сигнал/шум на 160/80 м у прийомі: відкидає високий кут і спрямована; ККД жахливий (потужність гине в землі/навантаженні), тож ніколи не передає."},
  xrefs:[['#rhombic','Rhombic','Ромбічна'],['#dipole','Dipole','Диполь']]
});

/* ---- 1.14 T / Fan dipole -------------------------------------------- */
WIRE.push({
  id:'tfan', num:'1.14', lvl:3,
  desc:{en:"Wire antennas that fight the low bands' huge wavelengths. A T-antenna adds a horizontal top-hat to a short vertical, capacitively lengthening it; a fan dipole hangs several dipoles of different lengths from one feed for multiband coverage.",
        uk:"Дротові антени проти величезних довжин хвиль НЧ-діапазонів. T-антена додає горизонтальний «капелюх» до короткої вертикалі, ємнісно подовжуючи її; віялоподібний диполь підвішує кілька диполів різної довжини на одне живлення для багатодіапазонності."},
  methods:[{id:'induced', en:'Top-loaded / multi-wire (induced-EMF)', uk:'Верхнє навантаж. / багатопровідна (наведені ЕРС)',
     desc:{en:"Top-loading raises the current at the base, increasing the effective height of a short vertical without more mast. For a fan dipole each branch resonates near its own half-wave band; the feed sees whichever branch is resonant.",
           uk:"Верхнє навантаження піднімає струм біля основи, збільшуючи ефективну висоту короткої вертикалі без вищої щогли. У віялоподібному диполі кожна гілка резонує біля свого пів-хвильового діапазону; живлення бачить резонансну гілку."},
     formula:[{en:"h_eff = h·[1 − (tan(kh/2))/(kh/2)]⁻¹ (top-loading raises h_eff toward h)",
               uk:"h_еф = h·[1 − (tan(kh/2))/(kh/2)]⁻¹ (верхнє навантаж. піднімає h_еф до h)"}]}],
  controls:[
    {id:'band', kind:'select', en:'Fan branch (band)', uk:'Гілка (діапазон)', value:'14',
     options:[{value:'7',en:'40 m (7 MHz)',uk:'40 м (7 МГц)'},{value:'14',en:'20 m (14 MHz)',uk:'20 м (14 МГц)'},{value:'21',en:'15 m (21 MHz)',uk:'15 м (21 МГц)'},{value:'28',en:'10 m (28 MHz)',uk:'10 м (28 МГц)'}]},
    {id:'top', kind:'range', en:'Top-hat length', uk:'Довжина капелюха', min:0, max:0.25, step:0.005, value:0.1, fmt:v=>v.toFixed(3)+' λ'}
  ],
  plot:'full',
  compute(s){
    const fMHz=parseFloat(s.band), lamCm=AL.c/(fMHz*1e6)*100;
    const fnBeam=a=>AL.dipolePattern((90-a)*AL.D2R,0.5);
    const axis=th=>AL.dipolePattern(th,0.5); const D=AL.directivityAxial(axis);
    // A T / fan is a VERTICAL radiator with capacity hats — upright, like the
    // other omni wires, with the hat wires spreading horizontally.
    const cx=190, cy=125, px=scaleFor(0.5*lamCm,150), Lpx=0.5*lamCm*px, topPx=s.top*lamCm*px;
    let schemE=AL.rulerSVG(40,28,lamCm,px)+AL.CAP_E();
    schemE+=AL.rodVert(cx,cy,Lpx,'schem-driven');
    schemE+=`<line class="schem-wire" x1="${cx-topPx}" y1="${cy-Lpx/2}" x2="${cx+topPx}" y2="${cy-Lpx/2}"/>`;
    schemE+=`<line class="schem-wire" x1="${cx-topPx}" y1="${cy+Lpx/2}" x2="${cx+topPx}" y2="${cy+Lpx/2}"/>`;
    schemE+=`<text class="schem-label" x="${cx+topPx+4}" y="${cy-Lpx/2-4}">${AL.tr('capacity hat','ємнісний капелюх')}</text>`;
    schemE+=AL.dimLineV(cx+topPx+16,cy-Lpx/2,cy+Lpx/2,`≈ λ/2`);
    schemE+=`<text class="schem-label" x="${cx}" y="${cy+Lpx/2+22}" text-anchor="middle">${(0.5*lamCm/100).toFixed(1)} ${AL.unit('m')} @ ${fMHz} ${AL.unit('MHz')}</text>`;
    schemE+=AL.boresightArrow(cx+topPx+70,cy,30,V,'tfE');
    let schemH=AL.rulerSVG(40,28,lamCm,px)+AL.CAP_H();
    schemH+=AL.azimuthCircle(cx,cy,Math.max(topPx+26,56),A);
    for(let q=0;q<6;q++){ const ang=q*Math.PI/3;
      schemH+=`<line class="schem-wire" x1="${cx}" y1="${cy}" x2="${(cx+topPx*Math.cos(ang)).toFixed(1)}" y2="${(cy+topPx*Math.sin(ang)).toFixed(1)}"/>`; }
    schemH+=AL.conductorEndOn(cx,cy,6);
    schemH+=AL.boresightArrow(cx+10,cy,Math.max(topPx+30,60),A,'tfH');
    schemH+=`<text class="schem-label" x="${cx}" y="${cy+Math.max(topPx+26,56)+18}" text-anchor="middle">${AL.tr('hat wires · omni in azimuth','дроти капелюха · всенапрямлена')}</text>`;
    return {schemE, schemH, fnBeam,
      meta3d:{lamCm, sizeLam:0.5, sizeLabel:'L ≈ 0.50 λ', gainDbi:2.15},
      readouts:[
        {k:AL.tr('Band','Діапазон'), v:fMHz.toFixed(0)+' '+AL.unit('MHz')},
        {k:AL.tr('Half-wave','Пів-хвиля'), v:(0.5*lamCm/100).toFixed(1)+' '+AL.unit('m')},
        {k:AL.tr('Directivity','Спрямованість'), v:D.dBi.toFixed(2)+' '+AL.unit('dBi')},
        {k:AL.tr('Top-load gain','Виграш капелюха'), v:'+'+(s.top*40).toFixed(0)+'% h_eff'}
      ]};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/T-antenna',label:'T-antenna'}},
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Fan_dipole',label:'Fan dipole'}}
  ],
  strength:{en:"Top-loading is the standard trick for efficient LF/MF verticals where a full λ/4 mast is impossible; fan dipoles give cheap multiband HF from a single feedline. Bandwidth per branch is still narrow.",
            uk:"Верхнє навантаження — стандартний прийом для ефективних НЧ/СЧ вертикалей, де повна щогла λ/4 неможлива; віялоподібні диполі дають дешевий багатодіапазонний КХ з одного фідера. Смуга гілки все ж вузька."},
  xrefs:[['#dipole','Dipole','Диполь'],['#monopole','Monopole','Монополь']]
});

/* ====================================================================== */
/*  PAGE BUILDER — turns each WIRE entry into a section + mounted explorer  */
/* ====================================================================== */
// Standard planes column (schematic svg + polar plot svg + 4 readouts).
function planesHTMLFor(id){
  return `
    <div class="plane-panel" style="flex:1 1 100%; min-width:300px;">
      <div class="sub-panel"><svg id="${id}_schem" viewBox="0 0 400 250"></svg></div>
    </div>
    <div class="plane-panel" style="flex:1 1 100%; min-width:300px;">
      <div class="sub-panel"><svg id="${id}_plot" viewBox="0 0 400 380"></svg>
        <div class="plane-readout">
          ${[0,1,2,3].map(i=>`<div class="item"><div class="k" id="${id}_k${i}"></div><div class="v" id="${id}_v${i}">-</div></div>`).join('')}
        </div>
      </div>
    </div>`;
}

function fillExtras(a){
  const rf=document.getElementById('refs-'+a.id); if(rf) rf.innerHTML=window.atlasRefs(a.refs);
  const tg=document.getElementById('tags-'+a.id); if(tg) tg.innerHTML=window.atlasTags(a.tags.std,a.tags.mod,a.tags.mth);
}

// Mount one explorer. mount() replaces #exp-<id> with the controls + planes
// columns, so the schematic/plot svg targets come from planesHTMLFor().
function mountOne(a){
  AL.mount(a.id,{ methods:(a.methods&&a.methods.length>1)?a.methods:null, controls:a.controls, planesHTML:AL.planesTwo(a.id),
    render:function(ctx){
      const out=a.compute(ctx.state, ctx.methodId);
      AL.renderPlanes(a.id, out, a);
      if(out.enable) for(const cid in out.enable) ctx.enable(cid,out.enable[cid]);
    }});
  fillExtras(a);
}

// section markup builder (separated so mount can supply the planes)
function buildSections(list, root){
  root.innerHTML=list.map(a=>{
    const multi=a.methods&&a.methods.length>1;
    const mdesc=(a.methods||[]).map((m,i)=>
      `<div class="method-body${(multi&&i>0)?' hidden':''}" data-method="${m.id}">
         <div class="desc-cols">
           <div><h4 data-en="${m.en}" data-uk="${m.uk}">${m.en}</h4>
             <p data-en="${m.desc.en}" data-uk="${m.desc.uk}">${m.desc.en}</p></div>
           <div>${(m.formula||[]).map(f=>`<span class="formula" data-en="${f.en}" data-uk="${f.uk}">${f.en}</span>`).join('')}</div>
         </div>
       </div>`).join('');
    return `<section id="${a.id}">
      <div class="num" data-en="${a.num} / wire" data-uk="${a.num} / дротова">${a.num} / wire</div>
      <h2><span class="badge l${a.lvl} lg">${['','I','II','III'][a.lvl]}</span>
          <span data-en="${a.en}" data-uk="${a.uk}">${a.en}</span></h2>
      <div id="tags-${a.id}"></div>
      <p class="desc" data-en="${a.desc.en}" data-uk="${a.desc.uk}">${a.desc.en}</p>
      <div class="method-desc">${mdesc}</div>
      <div class="panel"><div id="exp-${a.id}"></div></div>
      <div id="refs-${a.id}"></div>
      <div class="strength">
        <div class="st-title" data-en="Design notes" data-uk="Проєктні нотатки">Design notes</div>
        <span data-en="${a.strength.en}" data-uk="${a.strength.uk}">${a.strength.en}</span>
      </div>
      <div class="xrefs">${(a.xrefs||[]).map(x=>`<a href="${x[0]}" data-en="${x[1]}" data-uk="${x[2]}">${x[1]}</a>`).join('')}</div>
    </section>`;
  }).join('');
}

// names in WIRE lack en/uk/tags — pull them from CATALOG so data stays single-source
WIRE.forEach(a=>{ const c=CATALOG.flatMap(s=>s.antennas).find(x=>x.id===a.id)||{};
  a.en=c.en||a.id; a.uk=c.uk||a.id; a.tags={std:c.std||[],mod:c.mod||[],mth:c.mth||[]}; });

buildSections(WIRE, document.getElementById('sections'));
WIRE.forEach(mountOne);

// re-fill refs/tags on language change (mount re-renders the explorers)
window.onLangChangePage=function(){ WIRE.forEach(fillExtras); };
</script>
</body>
</html>
