    <h1 data-en="Wire Antennas" data-uk="Дротові антени">Wire Antennas</h1>
    <div class="eq-hero">F(θ) = [cos(π·L/λ·cosθ) − cos(π·L/λ)] / sinθ</div>

       data-uk="Від напівхвильового диполя до узгодженого ромба: чотирнадцять дротових антен, кожна з живим калькулятором ДН, динамічною схемою та аналітичним чи чисельним методом розрахунку. Змінюйте довжину, кількість елементів чи витків — і схема з діаграмою напрямленості реагують миттєво.">Fourteen wire antennas…</p>

<footer class="wrap-wide">
  <p data-en="Models are teaching-grade: patterns from the thin-wire / array-factor theory named on each card, impedances from the induced-EMF method. Real designs use full-wave NEC/MoM solvers — the method tags point you there."
     data-uk="Моделі навчального рівня: діаграми — з теорії тонкого проводу / множника решітки, названої на кожній картці; опори — методом наведених ЕРС. Реальні конструкції рахують повнохвильовими розв'язувачами NEC/MoM — мітки методів вказують куди дивитись.">Models are teaching-grade…</p>

<script>
const AL = window.AntennaLab;
const V = 'var(--teal)', A = 'var(--amber)';

/* ---------- shared schematic helpers ---------------------------------- */
// isotropic px/cm scale so the λ ruler is physically meaningful
function scaleFor(maxCm, budgetPx){ return budgetPx / Math.max(maxCm, 0.01); }

// a horizontal wire rod centred at (cx,cy), total length Lpx, feed gap at centre
function rodH(cx, cy, Lpx, cls){
  const gap = 5, x0 = cx - Lpx/2, x1 = cx + Lpx/2;
  return `<line class="${cls}" x1="${x0}" y1="${cy}" x2="${cx-gap}" y2="${cy}"/>`+
         `<line class="${cls}" x1="${cx+gap}" y1="${cy}" x2="${x1}" y2="${cy}"/>`+
         `<circle class="schem-node" cx="${cx-gap}" cy="${cy}" r="2"/>`+
         `<circle class="schem-node" cx="${cx+gap}" cy="${cy}" r="2"/>`;
}
// a vertical wire rod from (x,y0) up length Lpx
function rodV(x, y0, Lpx, cls){
  return `<line class="${cls}" x1="${x}" y1="${y0}" x2="${x}" y2="${y0-Lpx}"/>`;
}

/* ====================================================================== */
/*  ANTENNA DEFINITIONS                                                    */
/*  Each object → one <section> with a full interactive calculator.        */
/* ====================================================================== */
const WIRE = [];

/* ---- 1.1 Dipole ------------------------------------------------------ */
WIRE.push({
  id:'dipole', num:'1.1', lvl:2, cat:'dipole',
  methods:[
    {id:'induced', en:'Induced-EMF', uk:'Наведені ЕРС',
     desc:{en:"Closed-form radiation resistance and reactance from the induced-EMF integral over the assumed sinusoidal current — the classic hand method behind the 73 Ω half-wave figure.",
           uk:"Замкнені формули опору випромінювання й реактансу з інтеграла наведених ЕРС по синусоїдному струму — класичний ручний метод, що дає 73 Ом для напівхвильового."},
     formula:[{en:"R_r = η/2π·[C+ln(kL)−Ci(kL)+½sin(kL)(Si(2kL)−2Si(kL))+…]",
               uk:"R_r = η/2π·[C+ln(kL)−Ci(kL)+½sin(kL)(Si(2kL)−2Si(kL))+…]"},
              {en:"Z_in = (R_r + jX_m) / sin²(kL/2)", uk:"Z_вх = (R_r + jX_m) / sin²(kL/2)"}]},
    {id:'mom', en:'MoM (thin-wire)', uk:'MoM (тонкий провід)',
     desc:{en:"The thin-wire integral equation (Pocklington/Hallén) solved numerically — the basis of NEC/NEC2. Here we show the same current-distribution pattern; a full MoM additionally resolves the exact current and mutual coupling.",
           uk:"Інтегральне рівняння тонкого проводу (Поклінгтона/Галлена), розв'язане чисельно — основа NEC/NEC2. Тут показано ту саму ДН по розподілу струму; повний MoM додатково знаходить точний струм і взаємний зв'язок."},
     formula:[{en:"F(θ) = [cos(πL/λ·cosθ) − cos(πL/λ)] / sinθ",
               uk:"F(θ) = [cos(πL/λ·cosθ) − cos(πL/λ)] / sinθ"}]}
  ],
  controls:[
    {id:'f',kind:'freq',en:'Frequency f',uk:'Частота f',fmin:1,fmax:10000,value:0.3},
    {id:'L', kind:'range', en:'Length L', uk:'Довжина L', min:0.1, max:1.6, step:0.01, value:0.5,
     fmt:v=>v.toFixed(2)+' λ'},
    {id:'a', kind:'range', en:'Wire radius a', uk:'Радіус проводу a', min:0.0002, max:0.02, step:0.0002, value:0.001,
     fmt:v=>v.toFixed(4)+' λ'}
  ],
  desc:{en:"Two collinear conductors fed at the centre. Length in wavelengths sets everything: the pattern narrows and grows sidelobes past 1 λ, and the input impedance sweeps through resonance near 0.48 λ.",
        uk:"Два колінеарні провідники, що живляться в центрі. Довжина у довжинах хвиль визначає все: за 1 λ ДН звужується й обростає пелюстками, а вхідний опір проходить резонанс біля 0.48 λ."},
  plot:'full',
  compute(s){
    const Llam=s.L, aLam=s.a, lamCm=AL.lambdaOf(s.f*1e9)*100;
    const axis=th=>AL.dipolePattern(th,Llam);
    const fnBeam=a=>AL.dipolePattern((90-a)*AL.D2R,Llam); // beam broadside → up
    const D=AL.directivityAxial(axis);
    const Z=AL.dipoleZ(Llam,aLam);
    const samp=AL.sampleHalf(fnBeam,0.25,90);
    const hp=AL.findHPBW(samp,fnBeam), sl=AL.findFirstSidelobe(samp);
    // Two projections of a VERTICAL half-wave dipole: the E (vertical) plane
    // contains the wire, the H (azimuth) plane sees it end-on and is a circle.
    const px=scaleFor(Llam*lamCm,140), Lpx=Llam*lamCm*px, cx=190, cy=125;
    let schemE=AL.rulerSVG(40,30,lamCm,px)+AL.CAP_E();
    schemE+=AL.rodVert(cx,cy,Lpx,'schem-driven');
    schemE+=AL.dimLineV(cx+14,cy-Lpx/2,cy+Lpx/2,`L = ${Llam.toFixed(2)} λ`);
    schemE+=`<text class="schem-label" x="${cx}" y="${cy+Lpx/2+20}" text-anchor="middle">${(Llam*lamCm).toFixed(1)} ${AL.unit('cm')}</text>`;
    schemE+=AL.boresightArrow(cx+88,cy,34,V,'dipE');
    let schemH=AL.rulerSVG(40,30,lamCm,px)+AL.CAP_H();
    schemH+=AL.azimuthCircle(cx,cy,58,A);
    schemH+=AL.conductorEndOn(cx,cy,6);
    schemH+=AL.boresightArrow(cx+10,cy,44,A,'dipH');
    schemH+=`<text class="schem-label" x="${cx}" y="${cy+78}" text-anchor="middle">${AL.tr('omnidirectional in azimuth','всенапрямлена за азимутом')}</text>`;
    const vswrRef=Math.abs((Math.hypot(Z.Rin,Z.Xin)-73)/(Math.hypot(Z.Rin,Z.Xin)+73));
    const Lres=AL.findRoot(x=>AL.dipoleZ(x,aLam).Xin, 0.30, 0.70);
    const Lmax=AL.argMax(x=>AL.directivityAxial(th=>AL.dipolePattern(th,x)).lin, 0.4, 1.6, 24);
    const optima=[];
    if(Lres) optima.push({id:'L', value:Lres, tag:'e',
      label:AL.tr(`L \u2248 ${Lres.toFixed(3)} \u03bb \u2014 resonant (X_in = 0)`,
                  `L \u2248 ${Lres.toFixed(3)} \u03bb \u2014 \u0440\u0435\u0437\u043e\u043d\u0430\u043d\u0441 (X_\u0432\u0445 = 0)`)});
    optima.push({id:'L', value:Lmax, tag:'h',
      label:AL.tr(`L \u2248 ${Lmax.toFixed(2)} \u03bb \u2014 maximum directivity`,
                  `L \u2248 ${Lmax.toFixed(2)} \u03bb \u2014 \u043c\u0430\u043a\u0441\u0438\u043c\u0443\u043c \u0441\u043f\u0440\u044f\u043c\u043e\u0432\u0430\u043d\u043e\u0441\u0442\u0456`)});
    return {schemE, schemH, fnBeam, optima,
      meta3d:{lamCm, sizeLam:Llam, sizeLabel:'L = '+Llam.toFixed(2)+' λ', gainDbi:D.dBi},
      readouts:[
        {k:AL.tr('Directivity','Спрямованість'), v:D.dBi.toFixed(2)+' '+AL.unit('dBi')},
        {k:'HPBW', v:AL.fmtDeg(hp)},
        {k:AL.tr('First SLL','1-а бок. пелюстка'), v:AL.fmtDb(sl.level)},
        {k:AL.tr('Z_in','Z_вх'), v:Z.Rin.toFixed(0)+(Z.Xin>=0?'+':'−')+'j'+Math.abs(Z.Xin).toFixed(0)+' '+AL.unit('ohm')}
      ]};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Dipole_antenna',label:'Dipole antenna'}, uk:{href:'https://uk.wikipedia.org/wiki/Диполь',label:'Диполь'}},
    {tag:'book', en:{href:'https://www.wiley.com/en-us/Antenna+Theory%3A+Analysis+and+Design%2C+4th+Edition-p-9781118642061',label:'Balanis, Antenna Theory'}},
    {tag:'code', en:{href:'https://www.nec2.org/',label:'NEC-2 thin-wire MoM'}}
  ],
  strength:{en:"The reference antenna: 2.15 dBi, 73 Ω at a half wavelength. Real dipoles need a balun (the feed is balanced) and shorten ~2–5 % for resonance because of the wire radius (end effect).",
            uk:"Еталонна антена: 2.15 дБі, 73 Ом на пів-хвилі. Реальні диполі потребують балуна (живлення симетричне) й коротшають на ~2–5 % для резонансу через радіус проводу (крайовий ефект)."},
  xrefs:[['#folded-dipole','Folded dipole','Складений диполь'],['#monopole','Monopole','Монополь'],['#yagi','Yagi-Uda','Уда-Яги']]
});

/* ---- 1.2 Folded dipole ---------------------------------------------- */
WIRE.push({
  id:'folded-dipole', num:'1.2', lvl:2,
  desc:{en:"A half-wave dipole closed into a narrow loop. The two parallel conductors carry equal in-phase currents, stepping the feed impedance up by the square of the current-division ratio — 4× for equal-radius conductors, giving ≈ 292 Ω.",
        uk:"Напівхвильовий диполь, замкнений у вузьку петлю. Два паралельні провідники несуть рівні синфазні струми, підвищуючи вхідний опір у квадрат відношення поділу струму — у 4 рази для однакових провідників, тобто ≈ 292 Ом."},
  methods:[{id:'tl', en:'Transmission-line model', uk:'Модель лінії передачі',
     desc:{en:"The folded dipole = a radiating (antenna) mode superposed on a non-radiating transmission-line mode. The impedance step is (1+α)² where α is the current-division ratio set by the two conductor radii.",
           uk:"Складений диполь = випромінювальна (антенна) мода плюс невипромінювальна мода лінії передачі. Крок опору = (1+α)², де α — відношення поділу струму, задане радіусами двох провідників."},
     formula:[{en:"Z_in ≈ (1+α)²·Z_dipole,  α = ln(D/a₂)/ln(D/a₁)", uk:"Z_вх ≈ (1+α)²·Z_диполя,  α = ln(D/a₂)/ln(D/a₁)"},
              {en:"equal radii → Z_in ≈ 4·73 ≈ 292 Ω", uk:"однакові радіуси → Z_вх ≈ 4·73 ≈ 292 Ом"}]}],
  controls:[
    {id:'f',kind:'freq',en:'Frequency f',uk:'Частота f',fmin:1,fmax:10000,value:0.1},
    {id:'ratio', kind:'range', en:'Radius ratio a₁/a₂', uk:'Відношення a₁/a₂', min:0.2, max:5, step:0.1, value:1,
     fmt:v=>v.toFixed(1)},
    {id:'D', kind:'range', en:'Conductor spacing D', uk:'Відстань D', min:0.005, max:0.05, step:0.001, value:0.02,
     fmt:v=>v.toFixed(3)+' λ'}
  ],
  plot:'full',
  compute(s){
    const lamCm=AL.lambdaOf(s.f*1e9)*100;
    const fnBeam=a=>AL.dipolePattern((90-a)*AL.D2R,0.5);
    const axis=th=>AL.dipolePattern(th,0.5);
    const D=AL.directivityAxial(axis);
    // current-division ratio from conductor radii (a1 driven, a2 folded)
    const a1=0.001, a2=a1*s.ratio, Dd=s.D;
    const alpha=Math.log(Dd/a2)/Math.log(Dd/a1);
    const step=Math.pow(1+alpha,2);
    const Zin=step*73.1;
    const px=scaleFor(0.5*lamCm,220), Lpx=0.5*lamCm*px, cx=200, cy=120, gap=8;
    // upright narrow loop: the two conductors are side by side in plan view
    let schemE=AL.rulerSVG(40,30,lamCm,px)+AL.CAP_E();
    schemE+=`<path class="schem-driven" d="M ${cx-gap},${cy-Lpx/2} L ${cx-gap},${cy+Lpx/2} Q ${cx},${cy+Lpx/2+7} ${cx+gap},${cy+Lpx/2} L ${cx+gap},${cy-Lpx/2} Q ${cx},${cy-Lpx/2-7} ${cx-gap},${cy-Lpx/2} Z"/>`;
    schemE+=`<circle class="schem-node" cx="${cx-gap}" cy="${cy-3}" r="2"/><circle class="schem-node" cx="${cx-gap}" cy="${cy+3}" r="2"/>`;
    schemE+=AL.dimLineV(cx+18,cy-Lpx/2,cy+Lpx/2,`L ≈ 0.50 λ`);
    schemE+=`<text class="schem-label" x="${cx}" y="${cy+Lpx/2+22}" text-anchor="middle">${(0.5*lamCm).toFixed(1)} ${AL.unit('cm')}</text>`;
    schemE+=AL.boresightArrow(cx+88,cy,30,V,'fdE');
    let schemH=AL.rulerSVG(40,30,lamCm,px)+AL.CAP_H();
    schemH+=AL.azimuthCircle(cx,cy,58,A);
    schemH+=AL.conductorEndOn(cx-7,cy,5);
    schemH+=AL.conductorEndOn(cx+7,cy,5);
    schemH+=`<text class="schem-label" x="${cx}" y="${cy+24}" text-anchor="middle">D = ${(s.D*100).toFixed(1)} ${AL.unit('cm')}</text>`;
    schemH+=AL.boresightArrow(cx+14,cy,42,A,'fdH');
    schemH+=`<text class="schem-label" x="${cx}" y="${cy+78}" text-anchor="middle">${AL.tr('omnidirectional in azimuth','всенапрямлена за азимутом')}</text>`;
    return {schemE, schemH, fnBeam,
      meta3d:{lamCm, sizeLam:0.5, sizeLabel:'L ≈ 0.50 λ', gainDbi:D.dBi},
      readouts:[
        {k:AL.tr('Directivity','Спрямованість'), v:D.dBi.toFixed(2)+' '+AL.unit('dBi')},
        {k:AL.tr('Impedance step','Крок опору'), v:step.toFixed(2)+'×'},
        {k:AL.tr('Z_in','Z_вх'), v:Zin.toFixed(0)+' '+AL.unit('ohm')},
        {k:AL.tr('Match to 300 Ω','Узгодж. з 300 Ом'), v:(20*Math.log10(Math.abs((Zin-300)/(Zin+300))+1e-6)).toFixed(1)+' '+AL.unit('dB')}
      ]};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Dipole_antenna#Folded_dipole',label:'Folded dipole'}},
    {tag:'book', en:{href:'https://www.arrl.org/arrl-antenna-book',label:'ARRL Antenna Book'}}
  ],
  strength:{en:"Four-times the dipole impedance matches 300 Ω twin-lead directly and widens the bandwidth; the folded structure also DC-grounds the element. The classic FM/TV Yagi driven element.",
            uk:"Учетверо більший опір напряму узгоджується з 300-омною стрічкою й розширює смугу; складена структура ще й заземлює елемент по постійному струму. Класичний активний елемент FM/ТБ Yagi."},
  xrefs:[['#dipole','Dipole','Диполь'],['#yagi','Yagi-Uda','Уда-Яги'],['aperture.html#slot','Slot (Babinet)','Щілина (Бабіне)']]
});

/* ---- 1.3 Monopole ---------------------------------------------------- */
WIRE.push({
  id:'monopole', num:'1.3', lvl:2,
  desc:{en:"A quarter-wave rod over a ground plane. Image theory replaces the ground with the mirror half of a dipole: the pattern is the upper half of the dipole doughnut, the directivity doubles (+3 dB) and the radiation resistance halves (≈ 36 Ω).",
        uk:"Чвертьхвильовий штир над площиною землі. Теорія зображень замінює землю дзеркальною половиною диполя: ДН — верхня половина диполевого «бублика», спрямованість подвоюється (+3 дБ), а опір випромінювання вдвічі менший (≈ 36 Ом)."},
  methods:[{id:'image', en:'Image theory + induced-EMF', uk:'Зображення + наведені ЕРС',
     desc:{en:"An ideal infinite ground plane is modelled by an image monopole below it. Above the plane the fields are identical to a dipole of twice the length; below, they are zero — so the monopole radiates the same power into half the space.",
           uk:"Ідеальна нескінченна земля моделюється дзеркальним монополем під нею. Над площиною поля тотожні диполю подвійної довжини; під нею — нулю, тож монополь випромінює ту саму потужність у половину простору."},
     formula:[{en:"D_monopole = 2·D_dipole,  R_r,mono = ½·R_r,dipole ≈ 36 Ω",
               uk:"D_монополь = 2·D_диполь,  R_r,моно = ½·R_r,диполь ≈ 36 Ом"}]}],
  controls:[
    {id:'f',kind:'freq',en:'Frequency f',uk:'Частота f',fmin:1,fmax:10000,value:0.9},
    {id:'H', kind:'range', en:'Height H', uk:'Висота H', min:0.05, max:0.8, step:0.005, value:0.25,
     fmt:v=>v.toFixed(3)+' λ'},
    {id:'a', kind:'range', en:'Wire radius a', uk:'Радіус a', min:0.0002, max:0.02, step:0.0002, value:0.001,
     fmt:v=>v.toFixed(4)+' λ'}
  ],
  plot:'full',
  compute(s){
    const Llam=2*s.H, lamCm=AL.lambdaOf(s.f*1e9)*100;
    const axis=th=>AL.dipolePattern(th,Llam);
    // upper hemisphere only: pattern zero for a>90 (below ground). beam at horizon? For a monopole the max is along the ground plane (a=90). Orient plot: 0=up(zenith), lobe toward horizon.
    const fnBeam=a=>{ const ae=a%360; if(ae>90&&ae<270) return 0; return AL.dipolePattern(a*AL.D2R,Llam); };
    const D=AL.directivityAxial(axis); const Dm=D.dBi+3.01;
    const Z=AL.dipoleZ(Llam,s.a); const Rin=Z.Rin/2, Xin=Z.Xin/2;
    const px=scaleFor(s.H*lamCm,150), Hpx=s.H*lamCm*px, gx=200, gy=200;
    let schemE=AL.rulerSVG(40,28,lamCm,px)+AL.CAP_E();
    schemE+=AL.groundHatch(gx-92,gx+92,gy);
    schemE+=rodV(gx,gy,Hpx,'schem-driven');
    schemE+=`<circle class="schem-node" cx="${gx}" cy="${gy}" r="2.5"/>`;
    schemE+=AL.dimLineV(gx+16,gy-Hpx,gy,`H = ${(s.H*lamCm).toFixed(1)} ${AL.unit('cm')} = ${s.H.toFixed(2)} λ`);
    schemE+=`<text class="schem-label" x="${gx+50}" y="${gy+22}">${AL.tr('ground plane','площина землі')}</text>`;
    schemE+=AL.boresightArrow(gx+96,gy-Hpx*0.15,30,V,'monE');
    // plan: the whip is end-on at the centre of the ground plane
    const gyH=125;
    let schemH=AL.rulerSVG(40,28,lamCm,px)+AL.CAP_H();
    schemH+=`<circle class="schem-fill" cx="${gx}" cy="${gyH}" r="72"/>`;
    schemH+=AL.azimuthCircle(gx,gyH,58,A);
    schemH+=AL.conductorEndOn(gx,gyH,6);
    schemH+=AL.boresightArrow(gx+10,gyH,44,A,'monH');
    schemH+=`<text class="schem-label" x="${gx}" y="${gyH+88}" text-anchor="middle">${AL.tr('ground plane · omni in azimuth','площина землі · всенапрямлена')}</text>`;
    const Hres=AL.findRoot(x=>AL.dipoleZ(2*x,s.a).Xin, 0.15, 0.35);
    const optima=Hres?[{id:'H', value:Hres, tag:'e',
      label:AL.tr(`H \u2248 ${Hres.toFixed(3)} \u03bb \u2014 resonant (X_in = 0)`,
                  `H \u2248 ${Hres.toFixed(3)} \u03bb \u2014 \u0440\u0435\u0437\u043e\u043d\u0430\u043d\u0441 (X_\u0432\u0445 = 0)`)}]:null;
    return {schemE, schemH, fnBeam, optima,
      meta3d:{lamCm, sizeLam:s.H, sizeLabel:'H = '+s.H.toFixed(2)+' λ', gainDbi:Dm},
      readouts:[
        {k:AL.tr('Directivity','Спрямованість'), v:Dm.toFixed(2)+' '+AL.unit('dBi')},
        {k:AL.tr('R_r (input)','R_r (вхід)'), v:Rin.toFixed(0)+' '+AL.unit('ohm')},

    {tag:'book', en:{href:'https://www.wiley.com/en-us/Antenna+Theory%3A+Analysis+and+Design%2C+4th+Edition-p-9781118642061',label:'Balanis, ch. 4'}}

            uk:"36 Ом — прийнятне узгодження з 50-омним коаксіалом без балуна, тож усі штирі та автомобільні антени. Скінченна/недосконала земля піднімає ДН угору й додає втрати; радіальні противаги наближують ідеальну площину."},
  xrefs:[['#dipole','Dipole','Диполь'],['#rubber-duck','Rubber duck','Гумова качечка'],['#discone','Discone','Дискоконусна']]

/* ---- 1.4 IFA / ILA --------------------------------------------------- */
WIRE.push({
  id:'ifa', num:'1.4', lvl:3,
  desc:{en:"A monopole bent over parallel to the ground plane. The horizontal arm adds top-loading so the antenna resonates when the total unfolded length ≈ λ/4, at a fraction of the height. The shorting pin and feed pin position tune resonance and match.",
        uk:"Монополь, зігнутий паралельно землі. Горизонтальне плече дає верхнє навантаження, тож антена резонує, коли повна розгорнута довжина ≈ λ/4, за частки висоти. Положення закорочувального й живильного штирів налаштовує резонанс і узгодження."},
  methods:[{id:'fem', en:'Resonant model (FEM-calibrated)', uk:'Резонансна модель (калібр. FEM)',
     desc:{en:"The bent near-field region defies simple closed forms, so FEM/MoM is used in practice. This calculator uses the standard quarter-wave resonance condition on the unfolded length and an empirical bandwidth from the enclosed volume.",
           uk:"Зігнута ближньопольова ділянка не має простих замкнених форм, тож на практиці беруть FEM/MoM. Цей калькулятор використовує стандартну умову чвертьхвильового резонансу по розгорнутій довжині та емпіричну смугу від об'єму."},
     formula:[{en:"f_res ≈ c / [4·(L_h + H)]   (unfolded quarter-wave)",
               uk:"f_рез ≈ c / [4·(L_г + H)]   (розгорнута чверть хвилі)"},
              {en:"BW ∝ antenna volume / λ³   (Chu limit trend)", uk:"Смуга ∝ об'єм / λ³   (тренд межі Чу)"}]}],
  controls:[
    {id:'Lh', kind:'range', en:'Horizontal arm L_h', uk:'Горизонт. плече L_г', min:5, max:120, step:1, value:40,
     fmt:v=>v.toFixed(0)+' '+AL.unit('mm')},
    {id:'H', kind:'range', en:'Height H', uk:'Висота H', min:2, max:30, step:0.5, value:8,
     fmt:v=>v.toFixed(1)+' '+AL.unit('mm')},
    {id:'feed', kind:'range', en:'Feed offset', uk:'Зсув живлення', min:0.05, max:0.6, step:0.01, value:0.2,
     fmt:v=>(v*100).toFixed(0)+' %'}
  ],
  plot:'full',
  compute(s){
    const totalMm=s.Lh+s.H, fresHz=AL.c/(4*totalMm/1000), fres=fresHz/1e9;
    const lamMm=AL.c/fresHz*1000;
    // pattern ~ tilted monopole/dipole ~0.25λ effective; roughly omni figure-8, tilted
    const fnBeam=a=>0.35+0.65*Math.abs(AL.dipolePattern((90-a*0.75)*AL.D2R,0.4));
    // bandwidth heuristic: match quality vs feed offset
    const vol=s.Lh*s.H*1.0, bwPct=AL.clamp(vol/ (lamMm*lamMm) *120, 0.8, 12);
    const matchDb=-3-14*Math.exp(-Math.pow((s.feed-0.22)/0.12,2));
    const px=6, cx=140, cy=150;
    const Lhpx=s.Lh*px/10*3, Hpx=s.H*px/10*3;
    const pxL=Math.min(150/Math.max(totalMm,1),3.2)*10/10, lamCmI=lamMm/10;
    const fx=cx+s.feed*Lhpx;
    let schemE=AL.rulerSVG(40,28,lamCmI,180/lamCmI/6)+AL.CAP_E();
    schemE+=AL.groundHatch(cx-24,cx+Lhpx+44,cy);
    schemE+=`<path class="schem-driven" d="M ${cx},${cy} L ${cx},${cy-Hpx} L ${cx+Lhpx},${cy-Hpx}"/>`;
    schemE+=`<line class="schem-driven" x1="${fx}" y1="${cy-Hpx}" x2="${fx}" y2="${cy}"/>`;
    schemE+=`<circle class="schem-node" cx="${fx}" cy="${cy}" r="2.5"/>`;
    schemE+=`<text class="schem-label" x="${cx-4}" y="${cy-Hpx-6}">${AL.tr('short','КЗ')}</text>`;
    schemE+=`<text class="schem-label" x="${fx+3}" y="${cy-6}">${AL.tr('feed','живл.')}</text>`;
    schemE+=AL.dimLineV(cx-16,cy-Hpx,cy,`H`);
    schemE+=AL.dimLineH(cx,cx+Lhpx,cy+30,`L_h = ${s.Lh.toFixed(0)} ${AL.unit('mm')}`);
    // plan: the horizontal arm lies over the ground plane, pins seen end-on
    const cyH=130;
    let schemH=AL.rulerSVG(40,28,lamCmI,180/lamCmI/6)+AL.CAP_H();
    schemH+=`<rect class="schem-fill" x="${cx-34}" y="${cyH-46}" width="${Lhpx+78}" height="92" rx="4"/>`;
    schemH+=`<line class="schem-driven" x1="${cx}" y1="${cyH}" x2="${cx+Lhpx}" y2="${cyH}"/>`;
    schemH+=AL.conductorEndOn(cx,cyH,5);
    schemH+=AL.conductorEndOn(fx,cyH,5);
    schemH+=`<text class="schem-label" x="${cx-6}" y="${cyH-12}">${AL.tr('short','КЗ')}</text>`;
    schemH+=`<text class="schem-label" x="${fx+4}" y="${cyH-12}">${AL.tr('feed','живл.')}</text>`;
    schemH+=`<text class="schem-label" x="${cx+Lhpx+8}" y="${cyH+4}">${AL.tr('arm','плече')}</text>`;
    schemH+=`<text class="schem-label" x="${cx-30}" y="${cyH+60}">${AL.tr('ground plane','площина землі')}</text>`;
    // the match model peaks at a feed tap 22 % along the arm
    const optima=[{id:'feed', value:0.22, tag:'e',
      label:AL.tr('feed tap \u2248 22 % of the arm \u2014 best match',
                  '\u0432\u0456\u0434\u0432\u0456\u0434 \u2248 22 % \u043f\u043b\u0435\u0447\u0430 \u2014 \u043d\u0430\u0439\u043a\u0440\u0430\u0449\u0435 \u0443\u0437\u0433\u043e\u0434\u0436\u0435\u043d\u043d\u044f')}];
    return {schemE, schemH, fnBeam, optima,
      meta3d:{lamCm:lamMm/10, sizeLam:totalMm/lamMm, sizeLabel:'L_h+H = '+(totalMm/lamMm).toFixed(3)+' λ'},
      readouts:[
        {k:AL.tr('Resonance f','Резонанс f'), v:fres.toFixed(2)+' '+AL.unit('GHz')},
        {k:'λ/4', v:(lamMm/4).toFixed(1)+' '+AL.unit('mm')},
        {k:AL.tr('Bandwidth','Смуга'), v:'≈ '+bwPct.toFixed(1)+' %'},
        {k:AL.tr('Match |S11|','Узгодж. |S11|'), v:matchDb.toFixed(1)+' '+AL.unit('dB')}
      ]};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Inverted-F_antenna',label:'Inverted-F antenna'}},
    {tag:'paper', en:{href:'https://doi.org/10.1109/MAP.2003.1232163',label:'IFA/PIFA review (IEEE APM)'}}
  ],
  strength:{en:"Low profile with a decent 50 Ω match makes the IFA the default embedded antenna for ISM modules. The price is narrow bandwidth (a few percent) — the fundamental Chu-limit penalty of a small antenna.",
            uk:"Малий профіль із прийнятним узгодженням 50 Ом робить IFA типовою вбудованою антеною ISM-модулів. Ціна — вузька смуга (кілька відсотків), фундаментальна плата за малу антену (межа Чу)."},
  xrefs:[['#pifa','PIFA','PIFA'],['#monopole','Monopole','Монополь'],['printed.html#patch','Patch','Патч']]
});

/* ---- 1.5 PIFA -------------------------------------------------------- */
WIRE.push({
  id:'pifa', num:'1.5', lvl:3,
  desc:{en:"The planar Inverted-F — a shorted rectangular patch. A shorting wall lets the patch resonate at roughly half the length of an ordinary λ/2 patch, and a dielectric substrate shrinks it further. The staple handset antenna.",
        uk:"Планарна обернена F — закорочений прямокутний патч. Закорочувальна стінка дає резонанс при вдвічі меншій довжині, ніж звичайний λ/2 патч, а діелектрична підкладка стискає його ще. Основна антена мобільних телефонів."},
  methods:[{id:'cavity', en:'Cavity model', uk:'Резонаторна модель',
     desc:{en:"A first-order patch approximation treats the volume under the patch as a resonant cavity. For a shorted (PIFA) patch the resonance condition combines the length and width into an effective quarter-wave; the dielectric constant scales it.",
           uk:"Наближення першого порядку розглядає об'єм під патчем як резонатор. Для закороченого (PIFA) патча умова резонансу поєднує довжину й ширину в ефективну чверть хвилі; діелектрична стала масштабує її."},
     formula:[{en:"f_res ≈ c / [4·(L + W)·√ε_r]   (shorted patch)",
               uk:"f_рез ≈ c / [4·(L + W)·√ε_r]   (закорочений патч)"}]}],
  controls:[
    {id:'L', kind:'range', en:'Patch length L', uk:'Довжина L', min:5, max:60, step:0.5, value:25, fmt:v=>v.toFixed(1)+' '+AL.unit('mm')},
    {id:'W', kind:'range', en:'Patch width W', uk:'Ширина W', min:2, max:40, step:0.5, value:10, fmt:v=>v.toFixed(1)+' '+AL.unit('mm')},
    {id:'h', kind:'range', en:'Height h', uk:'Висота h', min:1, max:12, step:0.5, value:6, fmt:v=>v.toFixed(1)+' '+AL.unit('mm')},
    {id:'er', kind:'range', en:'Substrate ε_r', uk:'Підкладка ε_r', min:1, max:10, step:0.1, value:1, fmt:v=>v.toFixed(1)}
  ],
  plot:'full',
  compute(s){
    const fresHz=AL.c/(4*(s.L+s.W)/1000*Math.sqrt(s.er)), fres=fresHz/1e9;
    const fnBeam=a=>0.4+0.6*Math.abs(Math.cos((a)*AL.D2R*0.5)); // hemispherical-ish
    const bwPct=AL.clamp(6*s.h/ (s.L) *Math.sqrt(1/s.er)*3, 1, 15);
    const px=4, cx=150, cy=150, Lpx=s.L*px, Wpx=Math.max(s.W*px*0.6,14), hpx=s.h*px;
    const lamCmP=AL.c/fresHz*100;
    let schemE=AL.rulerSVG(40,28,lamCmP,px*10)+AL.CAP_E();
    schemE+=`<rect class="schem-fill" x="${cx-Lpx/2}" y="${cy-hpx}" width="${Lpx}" height="6"/>`;
    schemE+=AL.groundHatch(cx-Lpx/2-14,cx+Lpx/2+14,cy);
    schemE+=`<line class="schem-driven" x1="${cx-Lpx/2}" y1="${cy-hpx}" x2="${cx-Lpx/2}" y2="${cy}"/>`;
    schemE+=`<line class="schem-driven" x1="${cx-Lpx/2+Lpx*0.3}" y1="${cy-hpx}" x2="${cx-Lpx/2+Lpx*0.3}" y2="${cy}"/>`;
    schemE+=`<circle class="schem-node" cx="${cx-Lpx/2+Lpx*0.3}" cy="${cy}" r="2.5"/>`;
    schemE+=`<text class="schem-label" x="${cx-Lpx/2-4}" y="${cy-hpx-6}">${AL.tr('short wall','КЗ стінка')}</text>`;
    schemE+=AL.dimLineH(cx-Lpx/2,cx+Lpx/2,cy+28,`L = ${s.L.toFixed(1)} ${AL.unit('mm')}`);
    schemE+=AL.dimLineV(cx-Lpx/2-16,cy-hpx,cy,`h`);
    // plan: the patch face, L × W, with the shorting wall along one edge
    const Wpx2=Math.max(s.W*px,16), cyH=120;
    let schemH=AL.rulerSVG(40,28,lamCmP,px*10)+AL.CAP_H();
    schemH+=`<rect class="schem-fill" x="${cx-Lpx/2}" y="${cyH-Wpx2/2}" width="${Lpx}" height="${Wpx2}"/>`;
    schemH+=`<rect x="${cx-Lpx/2}" y="${cyH-Wpx2/2}" width="${Lpx}" height="${Wpx2}" fill="none" stroke="var(--teal)" stroke-width="2"/>`;
    schemH+=`<line class="schem-driven" x1="${cx-Lpx/2}" y1="${cyH-Wpx2/2}" x2="${cx-Lpx/2}" y2="${cyH+Wpx2/2}" stroke-width="4"/>`;
    schemH+=AL.conductorEndOn(cx-Lpx/2+Lpx*0.3,cyH,5);
    schemH+=`<text class="schem-label" x="${cx-Lpx/2-4}" y="${cyH-Wpx2/2-6}">${AL.tr('short wall','КЗ стінка')}</text>`;
    schemH+=AL.dimLineH(cx-Lpx/2,cx+Lpx/2,cyH+Wpx2/2+22,`L = ${s.L.toFixed(1)} ${AL.unit('mm')}`);
    schemH+=AL.dimLineV(cx+Lpx/2+14,cyH-Wpx2/2,cyH+Wpx2/2,`W = ${s.W.toFixed(1)}`);
    return {schemE, schemH, fnBeam,
      meta3d:{lamCm:AL.c/fresHz*100, sizeLam:s.L/(AL.c/fresHz*1000), sizeLabel:'L = '+(s.L/(AL.c/fresHz*1000)).toFixed(3)+' λ'},
      readouts:[
        {k:AL.tr('Resonance f','Резонанс f'), v:fres.toFixed(2)+' '+AL.unit('GHz')},
        {k:AL.tr('Size vs λ/2 patch','Розмір vs λ/2'), v:'≈ 50 %'},
        {k:AL.tr('Bandwidth','Смуга'), v:'≈ '+bwPct.toFixed(1)+' %'},
        {k:AL.tr('Directivity','Спрямованість'), v:'≈ 4–6 '+AL.unit('dBi')}
      ]};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Planar_inverted-F_antenna',label:'PIFA'}},
    {tag:'paper', en:{href:'https://doi.org/10.1109/MAP.2003.1232163',label:'IFA/PIFA review'}}
  ],
  strength:{en:"Compact, planar and easily multiband (add slots/branches). Efficiency and bandwidth trade directly against height h and ground clearance — the handset designer's constant fight. Raising ε_r shrinks it but narrows the band.",
            uk:"Компактна, планарна, легко багатодіапазонна (додай слоти/гілки). ККД і смуга прямо конкурують із висотою h та зазором до землі — вічна боротьба розробника телефонів. Вищий ε_r стискає її, але звужує смугу."},
  xrefs:[['#ifa','IFA','IFA'],['printed.html#patch','Patch','Патч'],['printed.html#meander','Meander line','Меандрова']]
});

/* ---- 1.6 Loop -------------------------------------------------------- */
WIRE.push({
  id:'loop', num:'1.6', lvl:1,
  methods:[
    {id:'small', en:'Small loop (Biot–Savart)', uk:'Мала рамка (Біо–Савара)',
     desc:{en:"When the circumference is a small fraction of λ the current is uniform and the loop is a magnetic dipole: pattern ∝ sinθ (a doughnut around the loop axis), directivity 1.5, and a radiation resistance that scales as the fourth power of circumference — tiny, so the loop is dominated by ohmic loss.",
           uk:"Коли периметр — мала частка λ, струм рівномірний і рамка є магнітним диполем: ДН ∝ sinθ («бублик» навколо осі), спрямованість 1.5, а опір випромінювання росте як четвертий степінь периметра — крихітний, тож переважають омічні втрати."},
     formula:[{en:"R_r = 20π²·N²·(C/λ)⁴ Ω   (C = circumference)",
               uk:"R_r = 20π²·N²·(C/λ)⁴ Ом   (C = периметр)"},
              {en:"F(θ) = sinθ,   D = 1.5 (1.76 dBi)", uk:"F(θ) = sinθ,   D = 1.5 (1.76 дБі)"}]},
    {id:'resonant', en:'Resonant loop (C ≈ 1 λ)', uk:'Резонансна рамка (C ≈ 1 λ)',
     desc:{en:"When the circumference approaches one wavelength the current is no longer uniform, the pattern maximum swings onto the loop axis, the radiation resistance rises to ≈ 100 Ω and directivity reaches ≈ 3.4 dBi — the full-wave 'quad' loop.",
           uk:"Коли периметр наближається до довжини хвилі, струм уже нерівномірний, максимум ДН переходить на вісь рамки, опір випромінювання зростає до ≈ 100 Ом, а спрямованість сягає ≈ 3.4 дБі — повнохвильова рамка «квад»."},
     formula:[{en:"C ≈ 1 λ:  R_r ≈ 100 Ω,  D ≈ 3.4 dBi,  max on axis",
               uk:"C ≈ 1 λ:  R_r ≈ 100 Ом,  D ≈ 3.4 дБі,  макс. на осі"}]}
  ],
  desc:{en:"A closed conductor loop couples to the magnetic field. Its behaviour changes completely between the electrically-small regime (NFC, RFID, AM) and the resonant full-wave regime (quad).",
        uk:"Замкнутий контур зв'язується з магнітним полем. Його поведінка цілком різна в електрично-малому режимі (NFC, RFID, AM) та резонансному повнохвильовому (квад)."},
  controls:[
    {id:'f',kind:'freq',en:'Frequency f',uk:'Частота f',fmin:1,fmax:10000,value:0.014},
    {id:'C', kind:'range', en:'Circumference C', uk:'Периметр C', min:0.02, max:1.2, step:0.01, value:0.1, fmt:v=>v.toFixed(2)+' λ'},
    {id:'N', kind:'range', en:'Turns N', uk:'Витків N', min:1, max:30, step:1, value:1, fmt:v=>v.toFixed(0)}
  ],
  plot:'full',
  compute(s, method){
    const lamCm=AL.lambdaOf(s.f*1e9)*100, radLam=s.C/(2*Math.PI);
    let fnBeam, Rr, Dd;
    if(method==='resonant'){
      // full-wave loop: max on axis, pattern narrower; approx by cos-ish lobe on axis
      fnBeam=a=>Math.pow(Math.abs(Math.cos(a*AL.D2R)),1.3)*0.85+0.15;
      Rr=100*Math.pow(s.C,0); Dd=3.4;
    } else {
      fnBeam=a=>AL.smallLoopPattern((90-a)*AL.D2R); // sinθ doughnut, axis vertical
      Rr=20*Math.PI*Math.PI*s.N*s.N*Math.pow(s.C,4); Dd=1.76;
    }

    // azimuth pattern omnidirectional. Edge-on from the side, a circle in plan.

    schemE+=AL.dimLineH(cx-rpx,cx+rpx,cy+40,`⌀ = ${(2*radLam*lamCm).toFixed(1)} ${AL.unit('cm')}`);
    let schemH=AL.rulerSVG(40,28,lamCm,px)+AL.CAP_H();
    schemH+=AL.azimuthCircle(cx,cy,Math.max(rpx+26,50),A);
    for(let t=0;t<Math.min(s.N,6);t++)
      schemH+=`<circle class="schem-driven" cx="${cx}" cy="${cy}" r="${Math.max(rpx-t*1.6,1)}" fill="none"/>`;
    schemH+=`<circle class="schem-node" cx="${cx-4}" cy="${cy+rpx}" r="2"/><circle class="schem-node" cx="${cx+4}" cy="${cy+rpx}" r="2"/>`;
    schemH+=`<text class="schem-label" x="${cx}" y="${cy+rpx+40}" text-anchor="middle">C = ${(s.C*lamCm).toFixed(1)} ${AL.unit('cm')} = ${s.C.toFixed(2)} λ</text>`;
    const optima = (method==='resonant')
      ? [{id:'C', value:1.0, tag:'e',
          label:AL.tr('C = 1.00 \u03bb \u2014 full-wave resonance',
                      'C = 1.00 \u03bb \u2014 \u043f\u043e\u0432\u043d\u043e\u0445\u0432\u0438\u043b\u044c\u043e\u0432\u0438\u0439 \u0440\u0435\u0437\u043e\u043d\u0430\u043d\u0441')}]
      : [{id:'C', value:0.1, tag:'h',
          label:AL.tr('C \u2272 0.10 \u03bb \u2014 upper limit of the small-loop model',
                      'C \u2272 0.10 \u03bb \u2014 \u043c\u0435\u0436\u0430 \u043c\u043e\u0434\u0435\u043b\u0456 \u043c\u0430\u043b\u043e\u0457 \u0440\u0430\u043c\u043a\u0438')}];
    return {schemE, schemH, fnBeam, optima, hplane: method==='resonant'?'same':'omni',
      meta3d:{lamCm, sizeLam:s.C, sizeLabel:'C = '+s.C.toFixed(2)+' λ', gainDbi:Dd},
      readouts:[

WIRE.push({
  id:'helical', num:'1.7', lvl:2,
  methods:[
    {id:'axial', en:'Axial mode (Kraus)', uk:'Осьовий режим (Крауса)',
     desc:{en:"When the circumference is about one wavelength the helix radiates a directional, circularly-polarised endfire beam along its axis. Kraus's traveling-wave formulas give gain, beamwidth and axial ratio directly from the number of turns and the pitch.",
           uk:"Коли периметр ≈ одна довжина хвилі, спіраль випромінює спрямований осьовий промінь колової поляризації вздовж осі. Формули біжучої хвилі Крауса дають підсилення, ширину променя та осьове відношення прямо з числа витків і кроку."},
     formula:[{en:"G ≈ 8.3 + 10·log₁₀(C_λ²·N·S_λ) dBi,   HPBW ≈ 52 / (C_λ√(N·S_λ))°",
               uk:"G ≈ 8.3 + 10·log₁₀(C_λ²·N·S_λ) дБі,   HPBW ≈ 52 / (C_λ√(N·S_λ))°"},
              {en:"axial ratio AR = (2N+1)/(2N)   → 1 as N grows", uk:"осьове відн. AR = (2N+1)/(2N)   → 1 зі зростанням N"}]},
    {id:'normal', en:'Normal mode', uk:'Нормальний режим',
     desc:{en:"When the helix is small compared with λ it behaves like a short dipole in series with a small loop: a low-gain, omnidirectional radiator (pattern ∝ sinθ) polarised along the axis. This is the 'rubber-duck' regime.",
           uk:"Коли спіраль мала порівняно з λ, вона поводиться як короткий диполь послідовно з малою рамкою: низькопідсилювальний всенаправлений випромінювач (ДН ∝ sinθ), поляризований уздовж осі. Це режим «гумової качечки»."},
     formula:[{en:"D ≈ 1.5 (1.76 dBi),  pattern ∝ sinθ,  bandwidth narrow",
               uk:"D ≈ 1.5 (1.76 дБі),  ДН ∝ sinθ,  смуга вузька"}]}
  ],
  desc:{en:"A conductor wound as a helix. The single geometry gives two utterly different antennas depending on how the circumference compares with the wavelength.",
        uk:"Провідник, намотаний спіраллю. Одна геометрія дає дві геть різні антени залежно від співвідношення периметра й довжини хвилі."},
  controls:[
    {id:'f',kind:'freq',en:'Frequency f',uk:'Частота f',fmin:1,fmax:10000,value:1.5},
    {id:'N', kind:'range', en:'Turns N', uk:'Витків N', min:2, max:30, step:1, value:10, fmt:v=>v.toFixed(0)},
    {id:'Clam', kind:'range', en:'Circumference C', uk:'Периметр C', min:0.2, max:1.4, step:0.01, value:1.0, fmt:v=>v.toFixed(2)+' λ'},
    {id:'pitch', kind:'range', en:'Pitch angle α', uk:'Кут кроку α', min:4, max:20, step:0.5, value:13, fmt:v=>v.toFixed(1)+'°'}
  ],
  plot:'full',
  compute(s, method){
    const Slam=s.Clam*Math.tan(s.pitch*AL.D2R); // spacing per turn in λ
    let fnBeam, G, hpbw, ar;
    if(method==='normal'){
      fnBeam=a=>AL.smallLoopPattern((90-a)*AL.D2R);
      G=1.76; hpbw=90; ar='—';
    } else {
      G=8.3+10*Math.log10(Math.max(s.Clam*s.Clam*s.N*Slam,1e-3));
      hpbw=52/(s.Clam*Math.sqrt(Math.max(s.N*Slam,1e-3)));
      ar=((2*s.N+1)/(2*s.N)).toFixed(2);
      // endfire array of N turns, spacing Slam, ordinary endfire (beam along axis=up=0)
      fnBeam=a=>{ const g=a*AL.D2R;
        const psi=2*Math.PI*Slam*(Math.cos(g)-1); const den=Math.sin(psi/2);
        const AFa=Math.abs(den)<1e-9?1:Math.abs(Math.sin(s.N*psi/2)/(s.N*den));
        return AFa; };
    }
    // Axial mode fires along the helix axis, which we lay HORIZONTAL so the
    // boresight is on the horizon like every other endfire antenna here; the
    // helix is a body of revolution about it, so both views are the same.
    // Normal mode radiates broadside from a vertical coil — an omni whip.
    const lamCmH=AL.lambdaOf(s.f*1e9)*100, pxH=Math.min(150/(s.Clam*lamCmH+0.01),16);
    const axial=(method!=='normal');
    const turns=Math.min(s.N,16), rxH=Math.max(s.Clam*lamCmH*pxH/(2*Math.PI),6);
    let schemE, schemH;
    if(axial){
      const x0=70, len=Math.min(s.N*Slam*lamCmH*pxH,210), dx=len/turns;
      let d=`M ${x0},${125-rxH}`;
      for(let i=0;i<turns;i++){ const x=x0+i*dx;
        d+=` C ${x},${125+rxH*1.4} ${x+dx},${125+rxH*1.4} ${x+dx},${125-rxH}`; }
      let g=AL.rulerSVG(40,28,lamCmH,pxH)+AL.CAP_SAME();
      g+=`<line class="schem-outline" x1="${x0-10}" y1="${125-rxH-16}" x2="${x0-10}" y2="${125+rxH+16}" stroke-width="3"/>`;
      g+=`<text class="schem-label" x="${x0-34}" y="${125+rxH+30}">${AL.tr('reflector','рефлектор')}</text>`;
      g+=`<path class="schem-driven" d="${d}" fill="none"/>`;
      g+=`<circle class="schem-node" cx="${x0}" cy="${125-rxH}" r="2.5"/>`;
      g+=`<line class="schem-dim" x1="${x0-10}" y1="125" x2="${x0+len+16}" y2="125" stroke-dasharray="3,3"/>`;
      g+=AL.dimLineH(x0,x0+len,125+rxH+22,`N·S = ${(s.N*Slam).toFixed(2)} λ`);
      g+=AL.dimLineV(x0+len+30,125-rxH,125+rxH,`C = ${s.Clam.toFixed(2)} λ`);
      schemE=g+AL.boresightArrow(x0+len+16,125,30,V,'helE');
      schemH=(g+AL.boresightArrow(x0+len+16,125,30,A,'helH'))
             .replace(/id="ar-helE/g,'id="ar-helH');
    } else {
      const cxN=190, coilH=150, dyN=coilH/turns;
      let d=`M ${cxN-rxH},${50}`;
      for(let i=0;i<turns;i++){ const y=50+i*dyN;
        d+=` C ${cxN+rxH},${y+dyN*0.25} ${cxN+rxH},${y+dyN*0.75} ${cxN-rxH},${y+dyN}`; }
      schemE=AL.rulerSVG(40,28,lamCmH,pxH)+AL.CAP_E();
      schemE+=`<path class="schem-driven" d="${d}" fill="none"/>`;
      schemE+=AL.groundHatch(cxN-70,cxN+70,50+coilH+10);
      schemE+=AL.dimLineV(cxN+rxH+18,50,50+coilH,`N·S`);
      schemE+=AL.boresightArrow(cxN+70,50+coilH*0.4,30,V,'helE');
      schemH=AL.rulerSVG(40,28,lamCmH,pxH)+AL.CAP_H();
      schemH+=AL.azimuthCircle(cxN,125,Math.max(rxH+30,52),A);
      schemH+=`<circle class="schem-driven" cx="${cxN}" cy="125" r="${rxH}" fill="none"/>`;
      schemH+=AL.conductorEndOn(cxN,125,5);
      schemH+=AL.boresightArrow(cxN+10,125,44,A,'helH');
      schemH+=`<text class="schem-label" x="${cxN}" y="${125+Math.max(rxH+30,52)+18}" text-anchor="middle">${AL.tr('omnidirectional in azimuth','всенапрямлена за азимутом')}</text>`;
    }
    // Kraus's axial-mode window: C ~ 1 lambda and a 12-14 deg pitch
    const optima = (method!=='normal') ? [
      {id:'Clam', value:1.0, tag:'h',
       label:AL.tr('C = 1.00 \u03bb \u2014 centre of the axial-mode window (0.75\u20131.33 \u03bb)',
                   'C = 1.00 \u03bb \u2014 \u0446\u0435\u043d\u0442\u0440 \u0432\u0456\u043a\u043d\u0430 \u043e\u0441\u044c\u043e\u0432\u043e\u0433\u043e \u0440\u0435\u0436\u0438\u043c\u0443 (0.75\u20131.33 \u03bb)')},
      {id:'pitch', value:13, tag:'e',
       label:AL.tr('\u03b1 = 13\u00b0 \u2014 optimum pitch angle (12\u201314\u00b0)',
                   '\u03b1 = 13\u00b0 \u2014 \u043e\u043f\u0442\u0438\u043c\u0430\u043b\u044c\u043d\u0438\u0439 \u043a\u0443\u0442 \u043a\u0440\u043e\u043a\u0443 (12\u201314\u00b0)')}
    ] : null;
    return {schemE, schemH, fnBeam, optima, hplane: method==='normal'?'omni':'same',
      meta3d:{lamCm:AL.lambdaOf(s.f*1e9)*100, sizeLam:(method==='normal'?s.Clam:s.N*Slam), sizeLabel:(method==='normal'?'C = '+s.Clam.toFixed(2)+' λ':'N·S = '+(s.N*Slam).toFixed(2)+' λ'), gainDbi:G},
      readouts:[
        {k:AL.tr('Gain','Підсилення'), v:G.toFixed(1)+' '+AL.unit('dBi')},
        {k:'HPBW', v:method==='normal'?'~90°':hpbw.toFixed(0)+'°'},
        {k:AL.tr('Axial ratio','Осьове відн.'), v:ar},
        {k:AL.tr('Spacing S','Крок S'), v:Slam.toFixed(3)+' λ'}
      ], enable:{Clam:true, pitch:method!=='normal'}};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Helical_antenna',label:'Helical antenna'}},
    {tag:'book', en:{href:'https://www.google.com/books/edition/Antennas/O0-PQgAACAAJ',label:'Kraus, Antennas'}}
  ],
  strength:{en:"Axial-mode helices give easy circular polarisation and 10–15 dBi from a few turns — the classic satellite/GNSS uplink antenna. The design is broadband (the 3/4 < C_λ < 4/3 window) and forgiving.",
            uk:"Осьові спіралі дають легку колову поляризацію та 10–15 дБі з кількох витків — класична антена супутник/ГНСС. Конструкція широкосмугова (вікно 3/4 < C_λ < 4/3) й невибаглива."},
  xrefs:[['#rubber-duck','Rubber duck','Гумова качечка'],['travelingwave.html#leaky-wave','Traveling-wave','Біжуча хвиля'],['#loop','Loop','Рамка']]
});

/* ---- 1.8 Rubber duck ------------------------------------------------- */
WIRE.push({
  id:'rubber-duck', num:'1.8', lvl:3,
  desc:{en:"A normal-mode helical monopole in a flexible dielectric jacket. Winding the conductor into a helix and loading it with dielectric makes a physically short whip resonate — trading efficiency and bandwidth for pocket size.",
        uk:"Спіральний монополь нормального режиму в гнучкій діелектричній оболонці. Намотка провідника спіраллю та діелектричне навантаження змушують фізично короткий штир резонувати — жертвуючи ККД і смугою заради розміру."},
  methods:[{id:'mom', en:'Helical-monopole model', uk:'Модель спірального монополя',
     desc:{en:"A full-wave MoM model of the wound wire is needed for accuracy; here we use the normal-mode result — an omnidirectional monopole-like pattern with an effective length set by the winding, and an efficiency that falls with foreshortening.",
           uk:"Для точності потрібен повнохвильовий MoM намотаного проводу; тут беремо нормальний режим — всенаправлену ДН монопольного типу з ефективною довжиною від намотки та ККД, що падає із вкороченням."},
     formula:[{en:"L_eff ≈ N·√(C² + S²)   (unwound wire), f_res set by L_eff ≈ λ/4",
               uk:"L_еф ≈ N·√(C² + S²)   (розгорнутий провід), f_рез при L_еф ≈ λ/4"}]}],
  controls:[
    {id:'phys', kind:'range', en:'Physical length', uk:'Фізична довжина', min:20, max:120, step:1, value:50, fmt:v=>v.toFixed(0)+' '+AL.unit('mm')},
    {id:'N', kind:'range', en:'Turns N', uk:'Витків N', min:8, max:60, step:1, value:30, fmt:v=>v.toFixed(0)},
    {id:'dia', kind:'range', en:'Coil diameter', uk:'Діаметр котушки', min:2, max:12, step:0.5, value:5, fmt:v=>v.toFixed(1)+' '+AL.unit('mm')}
  ],
  plot:'full',
  compute(s){
    const S=s.phys/s.N, C=Math.PI*s.dia, Leff=s.N*Math.sqrt(C*C+S*S); // mm unwound
    const fresHz=AL.c/(4*Leff/1000), fres=fresHz/1e9;
    const foreshort=s.phys/(1000*AL.c/fresHz/4); // phys / (λ/4)
    const eff=AL.clamp(30+55*foreshort,15,75);
    const fnBeam=a=>AL.smallLoopPattern((90-a)*AL.D2R)*0.9+0.1;
    const cx=190, top=55, coilH=Math.min(s.phys*1.6,150), turns=Math.min(s.N,22), dy=coilH/turns, rx=s.dia*2;

    for(let i=0;i<turns;i++){ const y=top+i*dy; d+=` C ${cx+rx},${y+dy*0.25} ${cx+rx},${y+dy*0.75} ${cx-rx},${y+dy}`; }
    let schemE=AL.rulerSVG(40,28,lamCmR,pxR)+AL.CAP_E();
    schemE+=`<rect class="schem-fill" x="${cx-rx-5}" y="${top-6}" width="${2*rx+10}" height="${coilH+12}" rx="6" opacity="0.4"/>`;
    schemE+=`<path class="schem-driven" d="${d}" fill="none"/>`;
    schemE+=AL.groundHatch(cx-62,cx+62,top+coilH+10);
    schemE+=`<circle class="schem-node" cx="${cx-rx}" cy="${top+coilH}" r="2.5"/>`;
    schemE+=AL.dimLineV(cx+rx+16,top,top+coilH,`${s.phys.toFixed(0)} ${AL.unit('mm')}`);
    schemE+=`<text class="schem-label" x="${cx-rx-2}" y="${top-10}">N = ${s.N.toFixed(0)}</text>`;
    schemE+=AL.boresightArrow(cx+64,top+coilH*0.45,30,V,'rdE');
    let schemH=AL.rulerSVG(40,28,lamCmR,pxR)+AL.CAP_H();
    schemH+=AL.azimuthCircle(cx,125,56,A);
    schemH+=`<circle class="schem-fill" cx="${cx}" cy="125" r="${rx+5}"/>`;
    schemH+=`<circle class="schem-driven" cx="${cx}" cy="125" r="${rx}" fill="none"/>`;
    schemH+=AL.conductorEndOn(cx,125,4);
    schemH+=AL.boresightArrow(cx+10,125,42,A,'rdH');
    schemH+=`<text class="schem-label" x="${cx}" y="${125+74}" text-anchor="middle">${AL.tr('jacketed coil · omni in azimuth','котушка в оболонці · всенапрямлена')}</text>`;
    return {schemE, schemH, fnBeam,
      meta3d:{lamCm:AL.c/fresHz*100, sizeLam:s.phys/(AL.c/fresHz*1000), sizeLabel:'L = '+(s.phys/(AL.c/fresHz*1000)).toFixed(3)+' λ'},
      readouts:[
        {k:AL.tr('Resonance f','Резонанс f'), v:fres.toFixed(2)+' '+AL.unit('GHz')},
        {k:AL.tr('Unwound L','Розгорн. L'), v:(Leff).toFixed(0)+' '+AL.unit('mm')},
        {k:AL.tr('Efficiency','ККД'), v:'≈ '+eff.toFixed(0)+' %'},
        {k:AL.tr('Directivity','Спрямованість'), v:'≈ 1.8 '+AL.unit('dBi')}
      ]};
  },
  refs:[
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Rubber_ducky_antenna',label:'Rubber ducky antenna'}},
    {tag:'wiki', en:{href:'https://en.wikipedia.org/wiki/Helical_antenna#Normal_mode',label:'Normal-mode helix'}}
  ],
  strength:{en:"Rugged, flexible and short — every handheld radio uses one. The compromise is efficiency: a 50 mm duck at 145 MHz is a small fraction of λ/4, so most gain is given up versus a full quarter-wave whip.",
            uk:"Міцна, гнучка й коротка — стоїть на кожній рації. Компроміс — ККД: 50-мм «качечка» на 145 МГц є малою часткою λ/4, тож більшість підсилення втрачено проти повного чвертьхвильового штиря."},
